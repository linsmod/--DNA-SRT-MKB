<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB 场 · 多通道 · 多观测面</title>
<style>
  html,body{margin:0;height:100%;background:#050508;overflow:hidden;
    font-family:system-ui,sans-serif;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}
  #overlay{pointer-events:none;}
  #ui{position:fixed;top:12px;left:12px;background:rgba(12,12,22,.88);color:#ccc;
    padding:12px 14px;border-radius:12px;font-size:12px;line-height:1.7;
    backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);width:240px;
    box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:10;max-height:calc(100vh - 24px);
    overflow-y:auto;}
  #ui .title{font-weight:600;color:#eee;font-size:13px;margin-bottom:8px;}
  #ui .row{display:flex;justify-content:space-between;margin-top:6px;}
  #ui input[type=range]{width:100%;margin:2px 0;accent-color:#8ab4f8;}
  #ui button{margin-top:4px;width:100%;padding:5px;background:#23233a;color:#ddd;
    border:1px solid rgba(255,255,255,.12);border-radius:6px;cursor:pointer;font-size:11px;}
  #ui button:hover{background:#2f2f4a;}
  #ui button.active{background:#3a4a7a;border-color:#8ab4f8;color:#fff;}
  #ui .group{display:flex;gap:4px;margin-top:4px;}
  #ui .group button{margin-top:0;flex:1;}
  .val{color:#8ab4f8;font-variant-numeric:tabular-nums;}
  .sec{color:#888;font-size:10px;margin-top:10px;letter-spacing:.5px;text-transform:uppercase;}
  .hint{color:#666;font-size:10px;margin-top:8px;line-height:1.5;}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    color:#f88;font-size:14px;background:#050508;z-index:100;text-align:center;padding:24px;}
</style>
</head>
<body>
<canvas id="gpu"></canvas>
<canvas id="overlay"></canvas>
<div id="ui">
  <div class="title">MKB 场 · 多观测面</div>

  <div class="sec">观测面</div>
  <div class="group">
    <button id="m0" class="active">切片</button>
    <button id="m1">体积</button>
  </div>
  <div class="group">
    <button id="m2">等值面</button>
    <button id="m3">球面</button>
  </div>

  <div class="sec">着色</div>
  <div class="group">
    <button id="c0" class="active">SRT</button>
    <button id="c1">标量</button>
  </div>

  <div class="sec">通道</div>
  <div class="group">
    <button id="chS" class="active">S</button>
    <button id="chR" class="active">R</button>
    <button id="chT" class="active">T</button>
  </div>

  <div class="row"><span>切片深度</span><span class="val" id="vD">0.00</span></div>
  <input type="range" id="sD" min="-1.1" max="1.1" step="0.01" value="0">

  <div class="row"><span>密度</span><span class="val" id="vDen">0.10</span></div>
  <input type="range" id="sDen" min="0.02" max="0.4" step="0.01" value="0.1">

  <div class="row"><span>等值面 iso</span><span class="val" id="vIso">0.50</span></div>
  <input type="range" id="sIso" min="0.05" max="0.95" step="0.01" value="0.5">

  <div class="row"><span>球面半径</span><span class="val" id="vRad">1.15</span></div>
  <input type="range" id="sRad" min="0.4" max="1.24" step="0.01" value="1.15">

  <div class="sec">场</div>
  <div class="row"><span>噪声尺度</span><span class="val" id="vF">1.4</span></div>
  <input type="range" id="sF" min="0.3" max="4" step="0.1" value="1.4">

  <div class="row"><span>控制点权重</span><span class="val" id="vW">0.55</span></div>
  <input type="range" id="sW" min="0" max="1" step="0.05" value="0.55">

  <div class="row"><span>骨架透明度</span><span class="val" id="vL">0.35</span></div>
  <input type="range" id="sL" min="0" max="1" step="0.05" value="0.35">

  <button id="btnNew">随机新种子</button>
  <div class="hint">拖动旋转 · 滚轮缩放<br>切换通道看 S/R/T 各自分布</div>
</div>
<div id="err"></div>

<script type="module">
(async () => {
'use strict';

const gpuCanvas = document.getElementById('gpu');
const ov = document.getElementById('overlay');
const ovCtx = ov.getContext('2d');
const errEl = document.getElementById('err');

function fail(msg) {
  errEl.textContent = msg;
  errEl.style.display = 'flex';
  throw new Error(msg);
}
if (!navigator.gpu) fail('当前浏览器不支持 WebGPU，请用 Chrome 113+ / Edge 113+。');
const adapter = await navigator.gpu.requestAdapter();
if (!adapter) fail('无法获取 WebGPU adapter。');
const device = await adapter.requestDevice();
const format = navigator.gpu.getPreferredCanvasFormat();
const context = gpuCanvas.getContext('webgpu');
context.configure({ device, format, alphaMode: 'opaque' });

// ---------- 状态 ----------
let seed = Math.random() * 1000;
let theta = 0.65, phi = 0.28, zoom = 1.0;
const dist = 3.2, focal = 2.0;
let noiseScale = 1.4;
let ctrlWeight = 0.55;
let lineAlpha = 0.35;
let sliceZ = 0.0;
let density = 0.10;
let isoValue = 0.50;
let sphereRadius = 1.15;
let mode = 0;       // 0 切片 1 体积 2 等值面 3 球面
let colorMode = 0;  // 0 SRT 1 标量
let chanS = 1, chanR = 1, chanT = 1;

const FIELD_RES = 64;
const FIELD_EXT = 1.25;

// ---------- 噪声 ----------
function hash3(x, y, z) {
  let h = (x * 374761393 + y * 668265263 + z * 2147483647 + seed * 7919) | 0;
  h = (h ^ (h >> 13)) * 1274126177;
  h = h ^ (h >> 16);
  return (h >>> 0) / 4294967295;
}
function smooth(t) { return t * t * (3 - 2 * t); }
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = smooth(xf), v = smooth(yf), w = smooth(zf);
  const c000 = hash3(xi, yi, zi),     c100 = hash3(xi+1, yi, zi);
  const c010 = hash3(xi, yi+1, zi),   c110 = hash3(xi+1, yi+1, zi);
  const c001 = hash3(xi, yi, zi+1),   c101 = hash3(xi+1, yi, zi+1);
  const c011 = hash3(xi, yi+1, zi+1), c111 = hash3(xi+1, yi+1, zi+1);
  const x00 = c000+(c100-c000)*u, x10 = c010+(c110-c010)*u;
  const x01 = c001+(c101-c001)*u, x11 = c011+(c111-c011)*u;
  const y0 = x00+(x10-x00)*v, y1 = x01+(x11-x01)*v;
  return y0+(y1-y0)*w;
}
function fbm(x, y, z) {
  let n = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 4; i++) { n += amp*noise3(x*f, y*f, z*f); amp *= 0.5; f *= 2; }
  return n;
}

// ---------- 控制点：S/R/T 结构化 ----------
// 顶点=S 主导，边=R 主导，面=T 主导，中心=平衡
function makeCtrl() {
  const pts = [];
  for (const x of [-1,0,1]) for (const y of [-1,0,1]) for (const z of [-1,0,1]) {
    const zeros = (x===0?1:0)+(y===0?1:0)+(z===0?1:0);
    let r, S, R, T;
    const j = (Math.random()-0.5)*0.4;
    if (zeros===0)      { r = 0.30; S = 0.95+j; R = 0.25+j; T = 0.20+j; }
    else if (zeros===1) { r = 0.34; S = 0.30+j; R = 0.95+j; T = 0.25+j; }
    else if (zeros===2) { r = 0.40; S = 0.25+j; R = 0.30+j; T = 0.95+j; }
    else                { r = 0.48; S = 0.60+j; R = 0.60+j; T = 0.60+j; }
    pts.push({ x, y, z, r, S, R, T, vis: 0.6+Math.random()*0.4 });
  }
  return pts;
}
let ctrl = makeCtrl();

function fieldSRT(x, y, z) {
  const nS = fbm(x*noiseScale + seed,        y*noiseScale, z*noiseScale);
  const nR = fbm(x*noiseScale + seed + 10.0, y*noiseScale, z*noiseScale);
  const nT = fbm(x*noiseScale + seed + 20.0, y*noiseScale, z*noiseScale);
  const nV = fbm(x*noiseScale + seed + 30.0, y*noiseScale, z*noiseScale);
  let s = 0, r = 0, t = 0, v = 0;
  for (let i = 0; i < ctrl.length; i++) {
    const p = ctrl[i];
    const dx = x-p.x, dy = y-p.y, dz = z-p.z;
    const d2 = dx*dx+dy*dy+dz*dz;
    const g = Math.exp(-d2 / (2*p.r*p.r));
    s += p.S * g; r += p.R * g; t += p.T * g; v += p.vis * g;
  }
  const w = ctrlWeight;
  return [
    nS*(1-w) + s*w,
    nR*(1-w) + r*w,
    nT*(1-w) + t*w,
    nV*(1-w) + v*w,
  ];
}

// ---------- 场纹理（rgba8: S,R,T,vis） ----------
let fieldTex = null;
function buildFieldTexture() {
  ctrl = makeCtrl();
  const N = FIELD_RES;
  const data = new Uint8Array(N*N*N*4);
  const step = (2*FIELD_EXT) / (N-1);
  const raw = new Float32Array(N*N*N*4);
  let mnS=Infinity,mxS=-Infinity,mnR=Infinity,mxR=-Infinity,
      mnT=Infinity,mxT=-Infinity,mnV=Infinity,mxV=-Infinity;
  let idx = 0;
  for (let k=0;k<N;k++) for (let j=0;j<N;j++) for (let i=0;i<N;i++) {
    const x = -FIELD_EXT + i*step;
    const y = -FIELD_EXT + j*step;
    const z = -FIELD_EXT + k*step;
    const [s,r,t,v] = fieldSRT(x, y, z);
    raw[idx] = s; raw[idx+1] = r; raw[idx+2] = t; raw[idx+3] = v;
    idx += 4;
    if (s<mnS)mnS=s; if (s>mxS)mxS=s;
    if (r<mnR)mnR=r; if (r>mxR)mxR=r;
    if (t<mnT)mnT=t; if (t>mxT)mxT=t;
    if (v<mnV)mnV=v; if (v>mxV)mxV=v;
  }
  const spS = (mxS-mnS)||1, spR = (mxR-mnR)||1,
        spT = (mxT-mnT)||1, spV = (mxV-mnV)||1;
  for (let i = 0; i < raw.length; i += 4) {
    data[i]   = Math.max(0, Math.min(255, ((raw[i]  -mnS)/spS*255)|0));
    data[i+1] = Math.max(0, Math.min(255, ((raw[i+1]-mnR)/spR*255)|0));
    data[i+2] = Math.max(0, Math.min(255, ((raw[i+2]-mnT)/spT*255)|0));
    data[i+3] = Math.max(0, Math.min(255, ((raw[i+3]-mnV)/spV*255)|0));
  }
  if (fieldTex) fieldTex.destroy();
  fieldTex = device.createTexture({
    size: [N, N, N],
    dimension: '3d',
    format: 'rgba8unorm',
    usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
  });
  device.queue.writeTexture(
    { texture: fieldTex }, data,
    { bytesPerRow: N*4, rowsPerImage: N },
    { width: N, height: N, depthOrArrayLayers: N }
  );
  rebuildBindGroup();
}

// ---------- 着色器 ----------
const shaderCode = `
struct Uniforms {
  camera: vec4<f32>,   // theta, phi, zoom, dist
  params: vec4<f32>,   // sliceZ, focal, fieldExt, mode
  extra:  vec4<f32>,   // density, resW, resH, isoValue
  extra2: vec4<f32>,   // colorMode, chanS, chanR, chanT
  extra3: vec4<f32>,   // sphereRadius, 0, 0, 0
};
@group(0) @binding(0) var<uniform> uni: Uniforms;
@group(0) @binding(1) var fieldTex: texture_3d<f32>;
@group(0) @binding(2) var fieldSampler: sampler;

struct VSOut {
  @builtin(position) pos: vec4<f32>,
  @location(0) uv: vec2<f32>,
};

@vertex
fn vs(@builtin(vertex_index) idx: u32) -> VSOut {
  var p = array<vec2<f32>, 3>(
    vec2<f32>(-1.0, -1.0),
    vec2<f32>( 3.0, -1.0),
    vec2<f32>(-1.0,  3.0)
  );
  var o: VSOut;
  o.pos = vec4<f32>(p[idx], 0.0, 1.0);
  o.uv = p[idx] * 0.5 + 0.5;
  return o;
}

fn sampleSRT(p: vec3<f32>, ext: f32) -> vec4<f32> {
  let uvw = p / (2.0 * ext) + 0.5;
  if (any(uvw < vec3<f32>(0.0)) || any(uvw > vec3<f32>(1.0))) {
    return vec4<f32>(-1.0);
  }
  return textureSampleLevel(fieldTex, fieldSampler, uvw, 0.0);
}

fn sampleScalar(p: vec3<f32>, ext: f32) -> f32 {
  let s = sampleSRT(p, ext);
  if (s.x < 0.0) { return -1.0; }
  return (s.x + s.y + s.z) / 3.0;
}

fn lut(t: f32) -> vec3<f32> {
  var s = array<vec4<f32>, 7>(
    vec4<f32>(0.00,  0.03, 0.05, 0.12),
    vec4<f32>(0.18,  0.12, 0.24, 0.47),
    vec4<f32>(0.38,  0.27, 0.51, 0.75),
    vec4<f32>(0.55,  0.55, 0.35, 0.71),
    vec4<f32>(0.72,  0.86, 0.31, 0.43),
    vec4<f32>(0.88,  0.96, 0.59, 0.24),
    vec4<f32>(1.00,  1.00, 0.92, 0.78)
  );
  var c = s[0].yzw;
  for (var i = 0; i < 6; i = i + 1) {
    if (t >= s[i].x && t <= s[i+1].x) {
      let u = (t - s[i].x) / max(1e-6, s[i+1].x - s[i].x);
      c = mix(s[i].yzw, s[i+1].yzw, u);
    }
  }
  return c;
}

fn shadeSRT(srt: vec3<f32>) -> vec3<f32> {
  // S 青白, R 紫红, T 暖橙
  let sCol = vec3<f32>(0.40, 0.88, 1.00);
  let rCol = vec3<f32>(0.88, 0.40, 1.00);
  let tCol = vec3<f32>(1.00, 0.55, 0.18);
  let total = srt.x + srt.y + srt.z + 1e-5;
  return (sCol*srt.x + rCol*srt.y + tCol*srt.z) / total;
}

fn applyChannel(srt: vec3<f32>) -> vec3<f32> {
  return srt * vec3<f32>(uni.extra2.y, uni.extra2.z, uni.extra2.w);
}

fn shade(p: vec3<f32>, ext: f32) -> vec3<f32> {
  let s = sampleSRT(p, ext);
  if (s.x < 0.0) { return vec3<f32>(0.0); }
  let srt = applyChannel(s.xyz);
  let cm = uni.extra2.x;
  if (cm < 0.5) {
    return shadeSRT(srt);
  } else {
    let v = clamp((srt.x + srt.y + srt.z) / 3.0, 0.0, 1.0);
    return lut(v);
  }
}

fn gradient(p: vec3<f32>, ext: f32) -> vec3<f32> {
  let e = 1.0 / 64.0;
  let dx = sampleScalar(p + vec3<f32>(e,0,0), ext) - sampleScalar(p - vec3<f32>(e,0,0), ext);
  let dy = sampleScalar(p + vec3<f32>(0,e,0), ext) - sampleScalar(p - vec3<f32>(0,e,0), ext);
  let dz = sampleScalar(p + vec3<f32>(0,0,e), ext) - sampleScalar(p - vec3<f32>(0,0,e), ext);
  let g = vec3<f32>(dx, dy, dz);
  let len = max(1e-5, length(g));
  return g / len;
}

fn intersectAABB(ro: vec3<f32>, rd: vec3<f32>, bmin: vec3<f32>, bmax: vec3<f32>) -> vec2<f32> {
  let invD = 1.0 / (rd + vec3<f32>(1e-8));
  let t0 = (bmin - ro) * invD;
  let t1 = (bmax - ro) * invD;
  let tmin = min(t0, t1);
  let tmax = max(t0, t1);
  let tNear = max(max(tmin.x, tmin.y), tmin.z);
  let tFar  = min(min(tmax.x, tmax.y), tmax.z);
  return vec2<f32>(tNear, tFar);
}

@fragment
fn fs(in: VSOut) -> @location(0) vec4<f32> {
  let res  = vec2<f32>(uni.extra.y, uni.extra.z);
  let th = uni.camera.x, ph = uni.camera.y;
  let zm = uni.camera.z, ds = uni.camera.w;
  let sliceZ = uni.params.x, focal = uni.params.y;
  let ext = uni.params.z, mode = uni.params.w;
  let density = uni.extra.x;
  let iso = uni.extra.w;
  let radius = uni.extra3.x;

  let ct = cos(th); let st = sin(th);
  let cp = cos(ph); let sp = sin(ph);

  // 世界 -> 观察: R = Ry * Rx
  let R = mat3x3<f32>(
    vec3<f32>(ct, 0.0, -st),
    vec3<f32>(st*sp, cp, ct*sp),
    vec3<f32>(st*cp, -sp, ct*cp)
  );
  let Rt = transpose(R);

  let cx = res.x * 0.5;
  let cy = res.y * 0.5;
  let sc = min(res.x, res.y) * 0.5 * zm;
  let px = in.uv.x * res.x;
  let py = (1.0 - in.uv.y) * res.y;
  let sx = (px - cx) / sc;
  let sy = (py - cy) / sc;

  let dirView = normalize(vec3<f32>(sx, sy, -focal));
  let originView = vec3<f32>(0.0, 0.0, ds);
  let dirWorld = Rt * dirView;
  let originWorld = Rt * originView;

  let bg = vec3<f32>(0.02, 0.02, 0.035);
  var color = bg;

  let bmin = vec3<f32>(-ext, -ext, -ext);
  let bmax = vec3<f32>( ext,  ext,  ext);

  if (mode < 0.5) {
    // ---- 切片 ----
    if (abs(dirWorld.z) > 1e-5) {
      let t = (sliceZ - originWorld.z) / dirWorld.z;
      if (t > 0.0) {
        let p = originWorld + t * dirWorld;
        let s = sampleSRT(p, ext);
        if (s.x >= 0.0) {
          let g = gradient(p, ext);
          let light = clamp(0.65 + 0.35 * dot(g, normalize(vec3<f32>(0.4,0.7,0.6))), 0.0, 1.0);
          color = shade(p, ext) * light;
        }
      }
    }
  } else if (mode < 1.5) {
    // ---- 体积 ray march ----
    let tt = intersectAABB(originWorld, dirWorld, bmin, bmax);
    let tNear = max(tt.x, 0.0);
    let tFar  = tt.y;
    if (tFar > tNear) {
      let steps = 96;
      let dt = (tFar - tNear) / f32(steps);
      var accum = vec3<f32>(0.0);
      var trans = 1.0;
      for (var i = 0; i < steps; i = i + 1) {
        let p = originWorld + dirWorld * (tNear + (f32(i)+0.5) * dt);
        let s = sampleSRT(p, ext);
        if (s.x >= 0.0) {
          let srt = applyChannel(s.xyz);
          let c = select(lut(clamp((srt.x+srt.y+srt.z)/3.0, 0.0, 1.0)),
                         shadeSRT(srt), uni.extra2.x < 0.5);
          let a = clamp(s.w * density * (0.5 + 0.5*(srt.x+srt.y+srt.z)), 0.0, 0.30);
          accum += trans * a * c;
          trans *= (1.0 - a);
          if (trans < 0.02) { break; }
        }
      }
      color = accum + bg * trans;
    }
  } else if (mode < 2.5) {
    // ---- 等值面 ----
    let tt = intersectAABB(originWorld, dirWorld, bmin, bmax);
    let tNear = max(tt.x, 0.0);
    let tFar  = tt.y;
    if (tFar > tNear) {
      let steps = 96;
      let dt = (tFar - tNear) / f32(steps);
      var tPrev = tNear;
      var vPrev = sampleScalar(originWorld + dirWorld * tPrev, ext);
      for (var i = 0; i < steps; i = i + 1) {
        let t = tNear + (f32(i)+1.0) * dt;
        if (t > tFar) { break; }
        let v = sampleScalar(originWorld + dirWorld * t, ext);
        if (v >= 0.0 && vPrev >= 0.0 &&
            (vPrev - iso) * (v - iso) <= 0.0 && abs(v - vPrev) > 1e-6) {
          // 二分细化
          var ta = tPrev; var tb = t;
          var va = vPrev; var vb = v;
          for (var j = 0; j < 6; j = j + 1) {
            let tm = (ta + tb) * 0.5;
            let vm = sampleScalar(originWorld + dirWorld * tm, ext);
            if ((va - iso) * (vm - iso) <= 0.0) { tb = tm; vb = vm; }
            else { ta = tm; va = vm; }
          }
          let tHit = (ta + tb) * 0.5;
          let pHit = originWorld + dirWorld * tHit;
          let n = gradient(pHit, ext);
          let light = clamp(0.25 + 0.75 * max(dot(n, normalize(vec3<f32>(0.4,0.7,0.5))), 0.0), 0.0, 1.0);
          let base = shade(pHit, ext);
          let rim = pow(1.0 - abs(dot(n, -dirWorld)), 2.0);
          color = base * light + rim * vec3<f32>(0.15, 0.20, 0.35);
          return vec4<f32>(color, 1.0);
        }
        tPrev = t; vPrev = v;
        if (v < 0.0) { break; }
      }
    }
  } else {
    // ---- 球面径向观测 ----
    let b = dot(originWorld, dirWorld);
    let c = dot(originWorld, originWorld) - radius * radius;
    let disc = b*b - c;
    if (disc > 0.0) {
      let sq = sqrt(disc);
      var tHit = -b - sq;
      if (tHit < 0.0) { tHit = -b + sq; }
      if (tHit > 0.0) {
        let pHit = originWorld + dirWorld * tHit;
        let n = normalize(pHit);
        let s = sampleSRT(pHit, ext);
        if (s.x >= 0.0) {
          let srt = applyChannel(s.xyz);
          let base = select(lut(clamp((srt.x+srt.y+srt.z)/3.0, 0.0, 1.0)),
                            shadeSRT(srt), uni.extra2.x < 0.5);
          let light = clamp(0.55 + 0.45 * max(dot(n, normalize(vec3<f32>(0.4,0.7,0.5))), 0.0), 0.0, 1.0);
          // 球面网格线：经纬线
          let lat = asin(clamp(n.y, -1.0, 1.0));
          let lon = atan2(n.z, n.x);
          let grid = 0.5 + 0.5 * sin(lat * 24.0) * sin(lon * 24.0);
          color = base * light * (0.85 + 0.15 * grid);
        }
      }
    }
  }

  return vec4<f32>(color, 1.0);
}
`;

const shaderModule = device.createShaderModule({ code: shaderCode });
const pipeline = await device.createRenderPipelineAsync({
  layout: 'auto',
  vertex: { module: shaderModule, entryPoint: 'vs' },
  fragment: { module: shaderModule, entryPoint: 'fs', targets: [{ format }] },
  primitive: { topology: 'triangle-list' },
});

// ---------- Uniform ----------
const uniformData = new Float32Array(20);
const uniformBuffer = device.createBuffer({
  size: uniformData.byteLength,
  usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
});
const sampler = device.createSampler({
  magFilter: 'linear', minFilter: 'linear',
  addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge', addressModeW: 'clamp-to-edge',
});
let bindGroup = null;
function rebuildBindGroup() {
  if (!fieldTex) return;
  bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: uniformBuffer } },
      { binding: 1, resource: fieldTex.createView() },
      { binding: 2, resource: sampler },
    ],
  });
}

// ---------- 尺寸 ----------
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  gpuCanvas.width = Math.round(W * DPR);
  gpuCanvas.height = Math.round(H * DPR);
  ov.width = gpuCanvas.width;
  ov.height = gpuCanvas.height;
  ovCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

// ---------- 骨架 overlay ----------
function projectPoint(x, y, z) {
  const ct = Math.cos(theta), st = Math.sin(theta);
  const cp = Math.cos(phi), sp = Math.sin(phi);
  const px = ct*x + st*sp*y + st*cp*z;
  const py = cp*y - sp*z;
  const pz = -st*x + ct*sp*y + ct*cp*z;
  const depth = dist - pz;
  if (depth < 0.1) return null;
  const sc = Math.min(W, H) * 0.5 * zoom;
  return { x: W*0.5 + (px/depth)*focal*sc, y: H*0.5 + (py/depth)*focal*sc, depth };
}
function drawSkeleton() {
  ovCtx.clearRect(0, 0, W, H);
  if (lineAlpha < 0.01) return;
  const V = [];
  for (const x of [-1,1]) for (const y of [-1,1]) for (const z of [-1,1]) V.push(projectPoint(x, y, z));
  const edges = [[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
  ovCtx.lineWidth = 1.2;
  ovCtx.strokeStyle = `rgba(160,200,255,${lineAlpha})`;
  ovCtx.beginPath();
  for (const [a,b] of edges) {
    if (!V[a] || !V[b]) continue;
    ovCtx.moveTo(V[a].x, V[a].y); ovCtx.lineTo(V[b].x, V[b].y);
  }
  ovCtx.stroke();

  const tetA = [0, 3, 5, 6], tetB = [1, 2, 4, 7];
  ovCtx.strokeStyle = `rgba(255,120,160,${lineAlpha*0.9})`;
  ovCtx.beginPath();
  for (const tet of [tetA, tetB]) {
    for (let i=0;i<4;i++) for (let j=i+1;j<4;j++) {
      const a = tet[i], b = tet[j];
      if (!V[a] || !V[b]) continue;
      ovCtx.moveTo(V[a].x, V[a].y); ovCtx.lineTo(V[b].x, V[b].y);
    }
  }
  ovCtx.stroke();

  for (let i=0;i<V.length;i++) {
    if (!V[i]) continue;
    ovCtx.beginPath();
    ovCtx.arc(V[i].x, V[i].y, 3, 0, 6.283);
    ovCtx.fillStyle = `rgba(255,255,255,${Math.min(1, lineAlpha*2)})`;
    ovCtx.fill();
  }
}

// ---------- 渲染 ----------
function updateUniform() {
  uniformData[0] = theta; uniformData[1] = phi;
  uniformData[2] = zoom;  uniformData[3] = dist;
  uniformData[4] = sliceZ; uniformData[5] = focal;
  uniformData[6] = FIELD_EXT; uniformData[7] = mode;
  uniformData[8] = density; uniformData[9] = W;
  uniformData[10] = H; uniformData[11] = isoValue;
  uniformData[12] = colorMode;
  uniformData[13] = chanS; uniformData[14] = chanR; uniformData[15] = chanT;
  uniformData[16] = sphereRadius; uniformData[17] = 0; uniformData[18] = 0; uniformData[19] = 0;
  device.queue.writeBuffer(uniformBuffer, 0, uniformData);
}
function frame() {
  if (!bindGroup) return;
  updateUniform();
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginRenderPass({
    colorAttachments: [{
      view: context.getCurrentTexture().createView(),
      loadOp: 'clear', storeOp: 'store',
      clearValue: { r: 0.02, g: 0.02, b: 0.03, a: 1 },
    }],
  });
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bindGroup);
  pass.draw(3);
  pass.end();
  device.queue.submit([encoder.finish()]);
  drawSkeleton();
  requestAnimationFrame(frame);
}

// ---------- 交互 ----------
let dragging = false, lastX = 0, lastY = 0;
gpuCanvas.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  gpuCanvas.setPointerCapture(e.pointerId);
});
gpuCanvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  theta -= dx * 0.008;
  phi   -= dy * 0.008;
  phi = Math.max(-1.4, Math.min(1.4, phi));
});
gpuCanvas.addEventListener('pointerup', e => {
  dragging = false;
  try { gpuCanvas.releasePointerCapture(e.pointerId); } catch(_) {}
});
gpuCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom *= Math.exp(-e.deltaY * 0.001);
  zoom = Math.max(0.35, Math.min(5, zoom));
}, { passive: false });

// ---------- UI ----------
const $ = id => document.getElementById(id);
function setMode(m) {
  mode = m;
  for (let i=0;i<4;i++) $('m'+i).classList.toggle('active', i===m);
}
$('m0').onclick = () => setMode(0);
$('m1').onclick = () => setMode(1);
$('m2').onclick = () => setMode(2);
$('m3').onclick = () => setMode(3);

function setColorMode(c) {
  colorMode = c;
  $('c0').classList.toggle('active', c===0);
  $('c1').classList.toggle('active', c===1);
}
$('c0').onclick = () => setColorMode(0);
$('c1').onclick = () => setColorMode(1);

function toggleChan(ch) {
  if (ch==='S') { chanS = chanS ? 0 : 1; $('chS').classList.toggle('active', !!chanS); }
  if (ch==='R') { chanR = chanR ? 0 : 1; $('chR').classList.toggle('active', !!chanR); }
  if (ch==='T') { chanT = chanT ? 0 : 1; $('chT').classList.toggle('active', !!chanT); }
}
$('chS').onclick = () => toggleChan('S');
$('chR').onclick = () => toggleChan('R');
$('chT').onclick = () => toggleChan('T');

$('sD').oninput = e => { sliceZ = +e.target.value; $('vD').textContent = sliceZ.toFixed(2); };
$('sDen').oninput = e => { density = +e.target.value; $('vDen').textContent = density.toFixed(2); };
$('sIso').oninput = e => { isoValue = +e.target.value; $('vIso').textContent = isoValue.toFixed(2); };
$('sRad').oninput = e => { sphereRadius = +e.target.value; $('vRad').textContent = sphereRadius.toFixed(2); };
$('sF').oninput = e => { noiseScale = +e.target.value; $('vF').textContent = noiseScale.toFixed(1); buildFieldTexture(); };
$('sW').oninput = e => { ctrlWeight = +e.target.value; $('vW').textContent = ctrlWeight.toFixed(2); buildFieldTexture(); };
$('sL').oninput = e => { lineAlpha = +e.target.value; $('vL').textContent = lineAlpha.toFixed(2); };
$('btnNew').onclick = () => { seed = Math.random() * 1000; buildFieldTexture(); };

// ---------- 启动 ----------
resize();
buildFieldTexture();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
