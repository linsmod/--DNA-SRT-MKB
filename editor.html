<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星四面体 · 配置编辑器</title>
<style>
  :root{
    --bg:#050508;
    --panel:rgba(12,12,22,.92);
    --panel2:rgba(20,20,34,.9);
    --line:rgba(255,255,255,.09);
    --txt:#c9c9d6;
    --txt-dim:#7b7b90;
    --accent:#8ab4f8;
    --S:#66e0ff;
    --R:#e066ff;
    --T:#ff8c2e;
    --ok:#5fd38a;
    --bad:#ff6b6b;
    --warn:#ffc857;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  /* ---------- 顶栏 ---------- */
  #topbar{display:flex;align-items:center;gap:18px;padding:8px 14px;
    background:var(--panel);border-bottom:1px solid var(--line);z-index:5;flex-wrap:wrap}
  .brand{font-size:14px;font-weight:600;color:#eee;white-space:nowrap}
  .brand .sub{font-size:11px;color:var(--txt-dim);font-weight:400;margin-left:6px}
  .fgroup{display:flex;align-items:center;gap:10px;padding:4px 10px;border:1px solid var(--line);
    border-radius:8px;background:rgba(255,255,255,.02)}
  .flabel{font-size:11px;color:var(--txt-dim);white-space:nowrap}
  .fgroup label{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt-dim)}
  .fgroup input[type=range]{width:96px;accent-color:var(--accent)}
  .fgroup select.palpick{background:#181828;color:#ddd;border:1px solid var(--line);border-radius:6px;
    font-size:11px;padding:2px 4px;max-width:116px}
  .fgroup input[type=color]{width:20px;height:16px;padding:0;border:1px solid var(--line);
    border-radius:3px;background:none;cursor:pointer}
  .val{color:var(--accent);font-variant-numeric:tabular-nums;min-width:42px;display:inline-block}
  .actions{margin-left:auto;display:flex;align-items:center;gap:6px}
  button{font:inherit;font-size:11px;padding:5px 10px;background:#22223a;color:#ddd;
    border:1px solid rgba(255,255,255,.12);border-radius:6px;cursor:pointer}
  button:hover{background:#2e2e4c}
  button:active{background:#3a4a7a}
  button.on{background:#3a4a7a;border-color:var(--accent);color:#fff}
  #saveState{font-size:10px;color:var(--txt-dim);margin-left:6px;min-width:92px;text-align:right}
  /* ---------- 主区 ---------- */
  main{flex:1;display:grid;grid-template-columns:250px 1fr 404px;min-height:0}
  aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  aside.right{border-right:none;border-left:1px solid var(--line)}
  aside::-webkit-scrollbar{width:8px}
  aside::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
  .ptitle{font-size:12px;font-weight:600;color:#eee;margin:2px 0 8px;display:flex;
    align-items:center;justify-content:space-between}
  .ptitle .hint{font-size:10px;color:var(--txt-dim);font-weight:400}
  .sect{border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02);
    padding:8px;margin-bottom:10px}
  .sect h4{margin:0 0 7px;font-size:11px;color:var(--txt-dim);font-weight:600;letter-spacing:.5px;
    display:flex;justify-content:space-between;align-items:center}
  /* 小四面体调色板 */
  .pieces{display:grid;grid-template-columns:1fr;gap:0}
  .vgrid6{flex:1 1 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:0}
  .vcell{border:1px solid transparent;border-radius:4px;padding:0}
  .vcell:hover{border-color:rgba(138,180,248,.55);background:rgba(255,255,255,.05)}
  .vcell svg{display:block;width:100%;height:auto}
  .vcell.dragging{opacity:.45;border-color:var(--accent)}
  .piece{display:flex;align-items:center;gap:8px;
    border:none;border-bottom:1px solid var(--line);border-radius:0;background:none;
    padding:5px 2px;position:relative}
  .piece:last-child{border-bottom:none}
  .piece.sel{background:rgba(138,180,248,.08)}
  .piece:hover{background:rgba(255,255,255,.03)}
  .piece:hover{border-color:rgba(138,180,248,.5)}
  .piece.sel{border-color:var(--accent);box-shadow:0 0 0 1px rgba(138,180,248,.35) inset}
  .piece svg{display:block;width:100%;height:auto}
  .piece .cap{flex:0 0 auto;display:flex;justify-content:flex-start;align-items:center;font-size:10px;gap:6px;
    color:var(--txt-dim);padding:0;white-space:nowrap}
  .piece .cap b{color:#ddd;font-weight:600;font-size:11px}
  .tag{font-size:10px;padding:0;border:none;border-radius:0;white-space:nowrap}
  .tag.ok{color:var(--ok);border-color:rgba(95,211,138,.4)}
  .tag.bad{color:var(--bad);border-color:rgba(255,107,107,.45)}
  .tag.use{color:var(--accent);border-color:rgba(138,180,248,.45)}
  /* 舞台 */
  #stage{position:relative;background:
    radial-gradient(1200px 700px at 50% 45%, #0d1020 0%, #050508 70%)}
  #view{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
  #view.drag{cursor:grabbing}
  #view.pan{cursor:move}
  #view polygon[data-kind=piece]:hover{fill:rgba(138,180,248,.10)}
  #hud{position:absolute;left:12px;bottom:10px;font-size:10px;color:var(--txt-dim);
    background:rgba(8,8,16,.7);padding:5px 9px;border-radius:6px;border:1px solid var(--line);
    pointer-events:none;line-height:1.6}
  #viewctl{position:absolute;right:12px;bottom:10px;display:flex;gap:5px}
  #hud i{display:inline-block;width:16px;height:0;border-top:2px solid;margin-right:5px;
    vertical-align:middle}
  /* 属性区 */
  .selbox .row{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
  .selbox .lb{font-size:10px;color:var(--txt-dim);min-width:52px}
  .seg{display:flex;gap:3px}
  .seg button{padding:3px 8px;font-size:11px}
  .seg button .st{font-size:9px;opacity:.85;margin-left:3px}
  .seg button.srtline{font-weight:600}
  .seg button.srtline.on{box-shadow:0 0 0 1px rgba(255,255,255,.35) inset}
  .seg button.srt-S.on{background:var(--S-soft);border-color:var(--S);color:#fff}
  .seg button.srt-R.on{background:var(--R-soft);border-color:var(--R);color:#fff}
  .seg button.srt-T.on{background:var(--T-soft);border-color:var(--T);color:#fff}
  /* 边列表：每条棱一行，号 / 色 / 虚实 三个并列元素 */
  .edgegrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
  .echip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;
    padding:3px 6px;cursor:pointer;background:rgba(255,255,255,.02)}
  .echip:hover{background:rgba(255,255,255,.06)}
  .echip.sel{border-color:var(--accent);background:rgba(138,180,248,.12)}
  .echip .el{font-size:10px;color:var(--txt-dim);min-width:24px}
  .echip .ec{flex:1;height:3px;border-radius:2px;min-width:12px}
  .echip .dsh{font-size:9px;color:var(--txt-dim);padding:0 6px;border-radius:9px;line-height:1.5;
    border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;min-width:26px}
  .echip .dsh:hover{color:#ddd;border-color:rgba(138,180,248,.55)}
  .echip .dsh.on{color:var(--accent);border-color:rgba(138,180,248,.55);background:rgba(138,180,248,.12)}
  /* 槽位属性表 */
  .tabs{display:flex;gap:5px;margin-bottom:7px}
  .tabs button{flex:1}
  table.grid{width:100%;border-collapse:collapse}
  table.grid td{border-top:1px solid var(--line);padding:5px 3px;vertical-align:middle}
  table.grid tr:hover td{background:rgba(255,255,255,.025)}
  /* 选中对象所在槽位行的高亮 */
  table.grid tr.hi td{background:rgba(138,180,248,.10)}
  table.grid tr.hi:hover td{background:rgba(138,180,248,.16)}
  table.grid tr.hi td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
  td.c-slot{width:62px}
  .slotname{display:block;font-size:11px;color:#eee;font-weight:600}
  .slotsub{display:block;font-size:9px;color:var(--txt-dim)}
  td.c-piece{width:74px}
  select.psel{width:100%;background:#181828;color:#ddd;border:1px solid var(--line);
    border-radius:5px;font-size:11px;padding:2px}
  .puse{display:block;font-size:9px;color:var(--txt-dim);margin-top:2px}
  button.mini{font-size:9px;padding:1px 4px;margin-top:3px;width:100%}
  td.c-var{width:150px}
  .vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
  .var{position:relative;border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.02);
    cursor:pointer;padding:1px}
  .var:hover{border-color:rgba(138,180,248,.55)}
  .var.on{border-color:var(--accent);background:rgba(138,180,248,.16)}
  .var.bad{opacity:.45;border-style:dashed}
  .var svg{display:block;width:100%;height:auto}
  .var em{position:absolute;left:2px;top:1px;font-size:8px;font-style:normal;color:var(--txt-dim)}
  .var .dot{position:absolute;right:2px;top:2px;width:5px;height:5px;border-radius:50%}
  td.c-state{width:46px;text-align:center;font-size:9px;color:var(--txt-dim)}
  .badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:8px;border:1px solid var(--line);
    color:var(--txt-dim);margin:1px}
  .badge.ok{color:var(--ok);border-color:rgba(95,211,138,.4)}
  .badge.bad{color:var(--bad);border-color:rgba(255,107,107,.45)}
  .badge.warn{color:var(--warn);border-color:rgba(255,200,87,.4)}
  /* 报告 */
  .rep{display:flex;flex-direction:column;gap:4px;max-height:210px;overflow-y:auto}
  .ritem{border-left:2px solid var(--line);padding:3px 7px;font-size:10px;line-height:1.5;
    cursor:pointer;border-radius:0 5px 5px 0;background:rgba(255,255,255,.02)}
  .ritem:hover{background:rgba(255,255,255,.06)}
  .ritem.bad{border-left-color:var(--bad)}
  .ritem.warn{border-left-color:var(--warn)}
  .ritem.ok{border-left-color:var(--ok)}
  details.help{font-size:10px;color:var(--txt-dim);line-height:1.65}
  details.help summary{cursor:pointer;color:var(--txt);font-size:11px;outline:none}
  details.help b{color:#ccc}
  .kv{font-size:10px;color:var(--txt-dim);line-height:1.7}
  .kv b{color:#ddd}
  /* SRT 配色组：顶栏下拉 + 取色器 */
  /* 分组镜像开关 */
  button.flipbtn{font-size:9px;padding:1px 7px;border-radius:9px;line-height:1.5;
    color:var(--txt-dim);border-color:var(--line)}
  button.flipbtn:hover{color:#ddd;border-color:rgba(138,180,248,.6)}
  button.flipbtn.on{background:rgba(138,180,248,.25);border-color:var(--accent);color:#fff}
  /* 拖动放置 */
  #dndGhost{position:fixed;z-index:99;pointer-events:none;font-size:11px;padding:3px 8px;border-radius:6px;
    background:rgba(20,20,34,.96);border:1px solid var(--accent);color:#fff;white-space:nowrap;
    box-shadow:0 6px 18px rgba(0,0,0,.55)}
  #dndGhost.bad{border-color:var(--bad);color:#ffb9b9}
  table.grid tr.drop-hover td{background:rgba(95,211,138,.18)}
  .piece.dragging{opacity:.45;border-color:var(--accent)}
  body.dnd{user-select:none;cursor:grabbing}
  /* 左栏参数控件 */
  .pgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pgroup select.palpick{flex:1 1 100%;background:#181828;color:#ddd;border:1px solid var(--line);
    border-radius:6px;font-size:13px;padding:5px 7px}
  .pgroup label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--txt-dim)}
  .pgroup input[type=color]{width:30px;height:22px;padding:0;border:1px solid var(--line);
    border-radius:4px;background:none;cursor:pointer}
  .pgroup button{padding:5px 10px;font-size:13px}
  .sliderrow{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--txt-dim);margin-bottom:10px}
  .sliderrow input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
  .sliderrow .val{min-width:46px;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums;font-size:12px}
  .btnrow{display:flex;gap:8px;margin-top:4px}
  .btnrow button{flex:1}
  .btnrow button.flipbtn{font-size:12px;padding:6px 10px;border-radius:6px}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">星四面体 · 配置编辑器<span class="sub">Merkaba / SRT 三角</span></div>
    <div class="actions">
      <button id="btnAlign" title="在两个镜像最优解之间切换">镜像</button>
      <button id="btnValidate">校验</button>
      <button id="btnExport">导出 JSON</button>
      <button id="btnImport">导入</button>
      <button id="btnReset">重置</button>
      <input type="file" id="fileImport" accept=".json,application/json" style="display:none">
      <span id="saveState">—</span>
    </div>
  </header>
  <main>
    <aside id="left">
      <div class="sect">
        <h4>配色</h4>
        <div class="pgroup">
          <select id="palSelect" class="palpick" title="SRT 配色组"></select>
          <label title="S 悦性 颜色">S<input type="color" id="palColorS"></label>
          <label title="R 变性 颜色">R<input type="color" id="palColorR"></label>
          <label title="T 惰性 颜色">T<input type="color" id="palColorT"></label>
          <button id="btnAddPal" title="新增配色组">+</button>
        </div>
      </div>
      <div class="sect">
        <h4>上四面体</h4>
        <label class="sliderrow">旋转<input type="range" id="rotU" min="-180" max="180" step="1" value="0"><span class="val" id="rotUv">0°</span></label>
        <label class="sliderrow">轴移<input type="range" id="offU" min="-0.8" max="0.8" step="0.01" value="0"><span class="val" id="offUv">0.00</span></label>
        <div class="btnrow">
          <button class="flipbtn" id="seqUpper" data-seq="upper" title="Shift 槽位（0-5）：四个槽位的内容轮换，顶点槽固定">Shift 槽位 0</button>
          <button class="flipbtn" id="flipUpper" data-mode="upper" title="组模式（0-5）：件内摆法的组级偏移">R0</button>
        </div>
      </div>
      <div class="sect">
        <h4>下四面体</h4>
        <label class="sliderrow">旋转<input type="range" id="rotD" min="-180" max="180" step="1" value="0"><span class="val" id="rotDv">0°</span></label>
        <label class="sliderrow">轴移<input type="range" id="offD" min="-0.8" max="0.8" step="0.01" value="0"><span class="val" id="offDv">0.00</span></label>
        <div class="btnrow">
          <button class="flipbtn" id="seqLower" data-seq="lower" title="Shift 槽位（0-5）：四个槽位的内容轮换，顶点槽固定">Shift 槽位 0</button>
          <button class="flipbtn" id="flipLower" data-mode="lower" title="组模式（0-5）：件内摆法的组级偏移">R0</button>
        </div>
      </div>
    </aside>

    <section id="stage">
      <svg id="view"></svg>
      <div id="viewctl">
        <button data-view="iso">斜视</button>
        <button data-view="front">正视</button>
        <button data-view="top">俯视</button>
        <button data-view="reset">复位</button>
      </div>
      <div id="hud"><div><i style="border-color:var(--S)"></i>S 悦性　<i style="border-color:var(--R)"></i>R 变性　<i style="border-color:var(--T)"></i>T 惰性</div>
        <div>实线 = 实　虚线 = 虚（由卦象三爻决定：三爻=S 二爻=R 初爻=T，可交错）</div>
        <div>空白左键拖 = 旋转 · 右键拖 = 平移 · 滚轮 = 缩放</div>
        <div>点件/棱/角点 = 选槽位 · 按住件或棱拖到角点 = 放置（同组交换）</div>
        <div><span id="camInfo"></span></div></div>
    </section>

    <aside class="right" id="right">
      <div class="sect">
        <h4>属性 Grid · 四个槽位</h4>
        <div class="tabs">
          <button data-tab="upper" class="on">上四面体</button>
          <button data-tab="lower">下四面体</button>
        </div>
        <div id="gridBox"></div>
      </div>
      <div class="sect">
        <h4>校验报告<span id="repSum" class="hint">未校验</span></h4>
        <div class="rep" id="repBox"><div class="kv">点顶部「校验」检查 SRT△ 规则与大边一致性。</div></div>
      </div>
    </aside>
  </main>
</div>

<script>
"use strict";
/* ============================================================
   0. 常量与模型
   ============================================================ */
const SCHEMA = 'mksr.star-tetrahedron.editor/1';
const LS_KEY  = 'mksr.starTet.editor.v1';

const SRT = {
  S:{cn:'悦性', color:'#66e0ff'},
  R:{cn:'变性', color:'#e066ff'},
  T:{cn:'惰性', color:'#ff8c2e'}
};
const SRT_ORDER = ['S','R','T'];

/* SRT 配色组：每组定义 S/R/T 三色，可增删改，随配置一起入 JSON */
const DEFAULT_PALETTES = [
  {id:'bw',   name:'白红灰', colors:{S:'#f4f6f8', R:'#e04b4b', T:'#9aa2ac'}},
  {id:'mkb',  name:'青紫橙', colors:{S:'#66e0ff', R:'#e066ff', T:'#ff8c2e'}},
  {id:'ink',  name:'丹青黛', colors:{S:'#e9c46a', R:'#d1495b', T:'#6c8598'}},
  {id:'neon', name:'霓虹',   colors:{S:'#4ff5ff', R:'#ff56c8', T:'#b6ff3a'}}
];

/* 小四面体 4 顶点 0(尖) 1,2,3(底)，6 条边 */
const EDGE_DEFS = [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
const EDGE_LABEL = ['0-1','0-2','0-3','1-2','1-3','2-3'];
const FACES = [[0,1,2],[0,1,3],[0,2,3],[1,2,3]];
const NEIGHBORS = [[1,2,3],[0,2,3],[0,1,3],[0,1,2]];   /* 每槽位相邻的 3 个大四面体顶点 */
const BIG_EDGES = [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];

/* 6 种摆法：perm[p-1] = 小四面体底顶点 p 落在插槽第几个邻位 */
const VARIANTS = [
  {id:'R0', perm:[0,1,2], desc:'旋转 0°'},
  {id:'R1', perm:[1,2,0], desc:'旋转 120°'},
  {id:'R2', perm:[2,0,1], desc:'旋转 240°'},
  {id:'M0', perm:[0,2,1], desc:'镜像 0°'},
  {id:'M1', perm:[1,0,2], desc:'镜像 120°'},
  {id:'M2', perm:[2,1,0], desc:'镜像 240°'}
];
const SLOT_NAMES = {upper:['A','B','C','D'], lower:['A','B','C','D']};
const SLOT_SUB   = {upper:['顶点','角 1','角 2','角 3'], lower:['底点','角 1','角 2','角 3']};

/* 组模式 = 摆法移位量 shift 0..5（0=R0 1=R1 2=R2 3=M0 4=M1 5=M2）
   每个 shift 对应一组「底顶点标签」置换 σ：底顶点 p 的颜色整体搬到 σ(p) 所在位置 */
const MODE_SIGMA = [
  [1,2,3],   /* shift 0 · 不动 */
  [2,3,1],   /* shift 1 · 旋转 120° */
  [3,1,2],   /* shift 2 · 旋转 240° */
  [1,3,2],   /* shift 3 · 镜像 */
  [3,2,1],   /* shift 4 · 镜像 + 旋转 120° */
  [2,1,3]    /* shift 5 · 镜像 + 旋转 240° */
];
/* 槽位序列 shift：与摆法同构的 6 种置换（顶点槽固定，底三槽循环/镜像）
   SEQ_SIGMA[g][i] = 档位 g 时槽 i 的内容取自基准槽 SEQ_SIGMA[g][i] */
const SEQ_SIGMA = [
  [0,1,2,3],   /* S0 · 不动 */
  [0,3,1,2],   /* S1 · 底三槽循环 */
  [0,2,3,1],   /* S2 · 底三槽循环×2 */
  [0,1,3,2],   /* S3 · 镜像（底1/2 对调） */
  [0,3,2,1],   /* S4 · 镜像变体 */
  [0,2,1,3]    /* S5 · 镜像变体 */
];
/* 相邻档位差分：从档 g 步进到档 g+1 时作用在当前内容上的 src 表 */
const SEQ_STEP = (()=>{
  const steps=[];
  for(let g=0; g<6; g++){
    const a=SEQ_SIGMA[g], b=SEQ_SIGMA[(g+1)%6];

/* 摆法置换 → 序号，便于反查 */

/* 右乘：π∘σ，即底顶点 p 落到 σ(p) 原本所在的位置 */
function composeShift(perm, sigma){
  const out=[0,0,0];
  for(let p=1;p<=3;p++) out[p-1] = perm[sigma[p-1]-1];
  return out;
}
function groupMode(key){
  const g = state.groups && state.groups[key];
  return (g && typeof g.mode==='number' && g.mode>=0 && g.mode<6) ? g.mode : 0;

/* 槽位序列 shift 档位（S0-S5） */
function groupSeq(key){

/* 槽位换件：若该件已被同组别的槽位占用，自动与它对调位置（避免两槽放同一件） */
function setSlotPiece(key, idx, pid){
  const slots = state.slots[key];
  if(!slots || !slots[idx]) return;
  const id = Number(pid);
  const other = slots.findIndex((s,i)=> i!==idx && Number(s.piece)===id);
  if(other >= 0) slots[other].piece = slots[idx].piece;   /* 原占用者换到本槽原来的件 */
  slots[idx].piece = id;
  ui.sel = {kind:'slot', frame:key, slot:idx};            /* 选中落到槽位 */
  commit();

/* 槽位换件 + 指定摆法（拖动 6 种摆法缩略图时用）：两个槽位的「件+摆法」成对互换 */
function setSlotPieceVar(key, idx, pid, variant){
  const slots = state.slots[key];
  if(!slots || !slots[idx]) return;
  const id = Number(pid);
  const v = Number(variant);
  const other = slots.findIndex((s,i)=> i!==idx && Number(s.piece)===id);
  const oldPiece = slots[idx].piece, oldVar = slots[idx].variant;
  if(other >= 0){
    slots[other].piece = oldPiece;
    slots[other].variant = oldVar;
  }
  slots[idx].piece = id;
  if(v>=0 && v<6) slots[idx].variant = v;
  ui.sel = {kind:'slot', frame:key, slot:idx};            /* 选中落到槽位 */
  commit();

/* 步进槽位序列 shift：把该组 4 个槽位的内容（件+摆法）按下一档差分置换搬运 */
function stepSlotShift(key){

  const old = slots.map(s=>({piece:s.piece, variant:s.variant}));
  for(let i=0;i<4;i++){
    slots[i].piece = old[src[i]].piece;
    slots[i].variant = old[src[i]].variant;

/* 有效摆法 = 槽位摆法 经组 shift 后的置换所对应的摆法序号 */
function effVariant(key, v){

/* 组模式下调色板里顶点的绘制落位（0=尖，1..3=底） */
function modeVertexMap(key){

  return [0, s[0], s[1], s[2]];

/* 正四面体（外接球半径 1），顶点 0 在 +Z */
const UP_VERTS = [
  [0, 0, 1],
  [0, 0.9428090416, -0.3333333333],
  [0.8164965809, -0.4714045208, -0.3333333333],
  [-0.8164965809, -0.4714045208, -0.3333333333]
];
const DOWN_VERTS = UP_VERTS.map(v => [v[0], v[1], -v[2]]);
const CANON = UP_VERTS;                 /* 小四面体调色板用的标准姿态 */
const K = 0.5;                          /* 小四面体占角比例：0.5 → 相邻件底顶点在大边中点重合，大边 = 两件尖边首尾相接 */
const BASE_SCALE = 205;                 /* 主视图投影尺度 */

/* 标准三色（K4 一因子分解：每面恰含 S/R/T 各一次） */
const STD_EDGES = [
  {srt:'S',style:'solid'}, {srt:'R',style:'solid'}, {srt:'T',style:'solid'},
  {srt:'T',style:'solid'}, {srt:'R',style:'solid'}, {srt:'S',style:'solid'}

/* ============================================================
   1. 状态
   ============================================================ */
let state = defaultState();
/* 主图默认视角：方位角 az = -199°，仰角 el = -10°（度 → 弧度），zoom 1、无平移 */
const DEG = Math.PI/180;
const VIEW_CAM = {az:-199*DEG, el:-10*DEG, zoom:1, panX:0, panY:0};
const cam = {...VIEW_CAM};
const ui  = {tab:'upper', sel:null};     /* sel: {kind:'edge'|'piece'|'slot', piece, edge, frame, slot} */
let lastReport = null;

function defaultState(){
  const pieces = [];
  for(let i=1;i<=8;i++){
    pieces.push({id:i, group:i<=4?'upper':'lower', edges:STD_EDGES.map(e=>({srt:e.srt,style:e.style}))});
  }
  const slots = {upper:[], lower:[]};
  /* 默认摆法取一组自洽解：8 件均满足 SRT△，且每个大边两端同色 */
  const DEF_VARIANTS = [1,5,0,4];   /* R1, M2, R0, M1：零色冲突且大边虚实全交错 */
  for(let i=0;i<4;i++){
    slots.upper.push({piece:1+i, variant:DEF_VARIANTS[i]});
    slots.lower.push({piece:5+i, variant:DEF_VARIANTS[i]});
  }
  return {
    schema:SCHEMA,
    savedAt:null,
    pieces, slots,
    paletteId: DEFAULT_PALETTES[0].id,
    palettes: DEFAULT_PALETTES.map(p=>({id:p.id, name:p.name, colors:{S:p.colors.S,R:p.colors.R,T:p.colors.T}})),
    groups:{ upper:{mode:0}, lower:{mode:0} },
    frames:{
      upper:{rotationDeg:0, axisOffset:0},
      lower:{rotationDeg:0, axisOffset:0}
    }

function activePalette(){
  return state.palettes.find(p=>p.id===state.paletteId) || state.palettes[0] || DEFAULT_PALETTES[0];
}
function srtColor(code){
  const p = activePalette();
  return (p && p.colors && p.colors[code]) || SRT[code].color;
}
function hexAlpha(hex,a){
  let h=String(hex||'').replace('#','');
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16);
  if(isNaN(n)) return `rgba(255,255,255,${a})`;
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
/* 把当前配色组写进 CSS 变量，全局控件/图例随之变色 */
function applyPaletteVars(){
  const root=document.documentElement;
  SRT_ORDER.forEach(k=>{
    const c=srtColor(k);
    root.style.setProperty('--'+k, c);
    root.style.setProperty('--'+k+'-soft', hexAlpha(c,0.22));
  });
}
function pieceById(id){ return state.pieces.find(p=>p.id===Number(id)) || null; }
/* 八卦名（帛书序）：1乾 2艮 3坎 4震 5坤 6兑 7离 8巽 */
const BAGUA = ['乾','艮','坎','震','坤','兑','离','巽'];
function pieceName(id){
  const n = Number(id);
  const g = BAGUA[n-1];
  return g ? n+g : String(n);
}
/* 八卦三爻 [初,二,三]，1=阳（实线）0=阴（虚线）：1乾 2艮 3坎 4震 5坤 6兑 7离 8巽 */
const GUA_LINES = {
  1:[1,1,1], 2:[0,0,1], 3:[0,1,0], 4:[1,0,0],
  5:[0,0,0], 6:[1,1,0], 7:[1,0,1], 8:[0,1,1]
};
/* 爻位 ↔ 颜色：三爻 = S，二爻 = R，初爻 = T */
const GUA_SRT_LINE = {S:2, R:1, T:0};
function guaLines(id){ return GUA_LINES[Number(id)] || [1,1,1]; }
/* 线型由卦象决定：同一 S/R/T 的边虚实一致，无需人工配置 */
function applyGuaStyles(pieces){
  (pieces||[]).forEach(p=>{
    const L = guaLines(p.id);
    p.edges.forEach(e=>{
      const i = GUA_SRT_LINE[e.srt];
      e.style = (i!==undefined && L[i]) ? 'solid' : 'dashed';
    });
  });
}
/* 卦象写进状态（存档 / 导出都带）：每件带卦名 + 三爻 [初,二,三]（1=阳实线 0=阴虚线），

function applyGuaMeta(st){
  const out = st || state;

    p.trigram = BAGUA[n-1] || '';

/* 某件所在的槽位（件在组内唯一） */
function slotOfPiece(pid){

    const i = state.slots[k].findIndex(s=>Number(s.piece)===Number(pid));
    if(i>=0) return {frame:k, slot:i};
  }
  return null;
}
/* 当前选中的槽位（件/边选中时按所在槽位换算）→ {frame, slot} */
function selSlotOf(){
  const s = ui.sel;
  if(!s) return null;
  if(s.kind==='slot') return {frame:s.frame, slot:Number(s.slot)};
  if(s.kind==='piece' || s.kind==='edge') return slotOfPiece(s.piece);
  return null;
}
function edgeIdxOf(a,b){ return EDGE_DEFS.findIndex(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a)); }
function saveState(){
  state.savedAt = new Date().toISOString();
  applyGuaMeta(state);      /* 卦象（卦名 + 三爻）一并存档 */
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    const d=new Date();
    const p=n=>String(n).padStart(2,'0');
    el('saveState').textContent = '已保存 '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }catch(e){

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    state = normalize(s);
    return true;
  }catch(e){ return false; }
}
/* 容错：补全缺省字段，任何非法值回落到默认 */
function normalize(s){
  const d = defaultState();
  if(!s || typeof s!=='object') return d;
  const out = d;
  if(Array.isArray(s.pieces)){
    s.pieces.forEach(p=>{
      const t = out.pieces.find(x=>x.id===Number(p.id));
      if(!t) return;
      if(Array.isArray(p.edges)){
        p.edges.forEach((e,i)=>{
          if(i<6 && e){
            if(SRT[e.srt]) t.edges[i].srt = e.srt;
            if(e.style==='dashed'||e.style==='solid') t.edges[i].style = e.style;
          }
        });
      }
    });
  }
  ['upper','lower'].forEach(k=>{
    if(s.slots && Array.isArray(s.slots[k])){
      s.slots[k].forEach((sl,i)=>{
        if(i>3 || !sl) return;
        const grp = k==='upper'?[1,2,3,4]:[5,6,7,8];
        const pid = Number(sl.piece);
        if(grp.includes(pid)) out.slots[k][i].piece = pid;
        const v = Number(sl.variant);
        if(v>=0 && v<6) out.slots[k][i].variant = v;
      });
    }
    if(s.frames && s.frames[k]){
      const r = Number(s.frames[k].rotationDeg);
      if(isFinite(r)) out.frames[k].rotationDeg = Math.max(-180, Math.min(180, r));
      const o = Number(s.frames[k].axisOffset);
      if(isFinite(o)) out.frames[k].axisOffset = Math.max(-0.8, Math.min(0.8, o));
    }
  });
  /* 配色组 */
  if(Array.isArray(s.palettes)){
    const pals=[];
    s.palettes.forEach((p,i)=>{
      if(!p || !p.colors) return;
      const cols={};
      SRT_ORDER.forEach(k=>{
        const v=String(p.colors[k]||'');
        cols[k] = /^#[0-9a-fA-F]{6}$/.test(v) ? v.toLowerCase() : DEFAULT_PALETTES[i%DEFAULT_PALETTES.length].colors[k];
      });
      pals.push({id:String(p.id||('p'+i)), name:String(p.name||('配色组 '+(i+1))).slice(0,24), colors:cols});
    });
    if(pals.length) out.palettes = pals;
  }
  if(s.paletteId && out.palettes.some(p=>p.id===s.paletteId)) out.paletteId = s.paletteId;

  if(s.groups && typeof s.groups==='object'){
    ['upper','lower'].forEach(k=>{
      const g = s.groups[k];
      if(!g) return;
      if(typeof g.mode==='number' && g.mode>=0 && g.mode<6) out.groups[k].mode = Math.floor(g.mode);
      else if(g.flip) out.groups[k].mode = 3;
      if(typeof g.seq==='number' && g.seq>=0 && g.seq<6) out.groups[k].seq = Math.floor(g.seq);
    });
  }
  applyGuaStyles(out.pieces);   /* 线型由卦象三爻决定 */
  applyGuaMeta(out);            /* 卦名 + 三爻（导入后也补齐，导出即可直接用） */
  return out;
}

/* ============================================================
   2. 几何
   ============================================================ */
function frameData(key){
  const base = key==='upper'?UP_VERTS:DOWN_VERTS;
  const f = state.frames[key];
  const th = f.rotationDeg*Math.PI/180, c=Math.cos(th), s=Math.sin(th), dz=f.axisOffset;
  return base.map(v=>[v[0]*c-v[1]*s, v[0]*s+v[1]*c, v[2]+dz]);
}
function socketPoints(key, slotIdx){
  const V = frameData(key);
  const apex = V[slotIdx];
  const nb = NEIGHBORS[slotIdx];
  const basePts = nb.map(j=>[
    apex[0]+K*(V[j][0]-apex[0]),
    apex[1]+K*(V[j][1]-apex[1]),
    apex[2]+K*(V[j][2]-apex[2])
  ]);
  return {apex, basePts, V, nb};
}
/* 小四面体在该插槽某摆法下的 4 个世界坐标点 */
function piecePoints(key, slotIdx, variantIdx){
  const sock = socketPoints(key, slotIdx);
  const perm = VARIANTS[variantIdx].perm;
  const pts = [sock.apex, null, null, null];
  for(let p=1;p<=3;p++) pts[p] = sock.basePts[perm[p-1]];
  return pts;
}
/* 从某插槽看：通向大四面体顶点 t 的那条“尖边”属于小四面体第几条边（0-2 为尖边） */
function apexEdgeIndex(slotIdx, variantIdx, t){
  const perm = VARIANTS[variantIdx].perm;
  const j = NEIGHBORS[slotIdx].indexOf(t);
  if(j<0) return -1;
  const p = perm.indexOf(j);       /* 0..2 */
  return p;                         /* 尖边 0,1,2 */
}
function edgeColorFromSlot(key, slotIdx, towardVertex, variantOverride){
  const slot = state.slots[key][slotIdx];
  const raw = (variantOverride!==undefined && variantOverride!==null) ? variantOverride : slot.variant;
  const v = effVariant(key, raw);
  const piece = pieceById(slot.piece);
  if(!piece) return null;
  const ei = apexEdgeIndex(slotIdx, v, towardVertex);
  if(ei<0) return null;
  return piece.edges[ei];
}
/* 大边两端一致性（override: 试摆 {slotIdx, variant}） */
function bigEdgeStatus(key, a, b, override){
  const o = override || {};      /* {slotIdx, variant} 试摆 */
  const sa = o.slotIdx!==undefined ? o.slotIdx : a;
  const ea = edgeColorFromSlot(key, sa, b, o.slotIdx!==undefined ? o.variant : undefined);
  const eb = edgeColorFromSlot(key, b, a);
  if(!ea || !eb) return {conflict:false, missing:true, color:null};
  const conflict = ea.srt !== eb.srt;
  /* 线型不参与一致性判断：允许大边两端虚实交错 */
  return {conflict, color: ea.srt, a:ea, b:eb};
}
/* 某插槽用某摆法时：与邻槽的颜色冲突数 + 虚实交错的边数 */
function variantConflicts(key, slotIdx, variantIdx){
  let c=0, mix=0;
  NEIGHBORS[slotIdx].forEach(t=>{
    const st = bigEdgeStatus(key, slotIdx, t, {slotIdx, variant:variantIdx});
    if(st.conflict) c++;
    else if(st.a && st.b && st.a.style !== st.b.style) mix++;   /* 同色但一实一虚 */
  });
  return {color:c, mix};
}
/* 贪心对齐：优先消色冲突，其次让大边两端虚实交错 */
function bestVariant(key, slotIdx){
  let best=state.slots[key][slotIdx].variant, bestScore=Infinity;
  for(let v=0;v<6;v++){
    const c=variantConflicts(key, slotIdx, v);
    const score=c.color*10 - c.mix;
    if(score<bestScore){ bestScore=score; best=v; }
  }
  return {variant:best, score:bestScore};
}
/* 穷举整组 6^4 种摆法组合，返回所有最优解（零色冲突优先，其次大边虚实交错） */
function bestLayouts(key){
  const slots = state.slots[key];
  const old = slots.map(s=>s.variant);
  let bestScore = Infinity, sols = [];
  const vs = [0,0,0,0];
  for(vs[0]=0; vs[0]<6; vs[0]++)
  for(vs[1]=0; vs[1]<6; vs[1]++)
  for(vs[2]=0; vs[2]<6; vs[2]++)
  for(vs[3]=0; vs[3]<6; vs[3]++){
    for(let i=0;i<4;i++) slots[i].variant = vs[i];
    let conf=0, mix=0;
    BIG_EDGES.forEach(([a,b])=>{
      const st = bigEdgeStatus(key, a, b);
      if(st.conflict) conf++;
      else if(st.a && st.b && st.a.style !== st.b.style) mix++;
    });
    const score = conf*100 - mix;
    if(score < bestScore){ bestScore = score; sols = [vs.slice()]; }
    else if(score === bestScore) sols.push(vs.slice());
  }
  for(let i=0;i<4;i++) slots[i].variant = old[i];
  return sols;
}
/* 对齐：取第一个最优解 */
function autoAlign(key){
  const sols = bestLayouts(key);
  if(!sols.length) return;
  for(let i=0;i<4;i++) state.slots[key][i].variant = sols[0][i];
}
/* 镜像：切换到另一个并列的最优解（两解互为镜像构型） */
function mirrorGroup(key){
  const sols = bestLayouts(key);
  if(!sols.length) return;
  const cur = state.slots[key].map(s=>s.variant).join('');
  const pick = sols.find(v=>v.join('')!==cur) || sols[0];
  for(let i=0;i<4;i++) state.slots[key][i].variant = pick[i];
}

/* ============================================================
   3. 投影
   ============================================================ */
function camBasis(c){
  const az=c.az, el=c.el;
  const C=[Math.sin(az)*Math.cos(el), -Math.cos(az)*Math.cos(el), Math.sin(el)];
  const f=[-C[0],-C[1],-C[2]];
  let r=[f[1],-f[0],0];
  const rl=Math.hypot(r[0],r[1])||1; r=[r[0]/rl,r[1]/rl,0];
  const u=[r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  return {r,u,f};
}
function projector(c,W,H){
  const {r,u,f}=camBasis(c);
  const s=BASE_SCALE*(c.zoom||1);
  const ox=W/2+(c.panX||0), oy=H/2+(c.panY||0);
  return p=>{
    const x=p[0]*r[0]+p[1]*r[1]+p[2]*r[2];
    const y=p[0]*u[0]+p[1]*u[1]+p[2]*u[2];
    const d=p[0]*f[0]+p[1]*f[1]+p[2]*f[2];
    return {x:ox+x*s, y:oy-y*s, d};
  };
}
function fitProjector(camObj,W,H,pts){
  const pr=projector(camObj,W,H);
  const P=pts.map(pr);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  P.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);});
  const w=Math.max(x1-x0,1e-6), h=Math.max(y1-y0,1e-6);
  const k=Math.min((W-8)/w,(H-8)/h);
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  return P.map(p=>({x:W/2+(p.x-cx)*k, y:H/2+(p.y-cy)*k, d:p.d}));
}

/* ============================================================
   4. 主视图渲染
   ============================================================ */
/* 相机参数显式化：主视图 HUD 与左侧图例都显示 az / el（度） */
function camText(c){
  const D = r=>r*180/Math.PI;
  return `az ${D(c.az).toFixed(1)}° · el ${D(c.el).toFixed(1)}° · zoom ${c.zoom.toFixed(2)}`;
}
function updateCamInfo(){
  const pal = el('palCamInfo');
  if(pal) pal.textContent = `图例视角 ${camText(PAL_CAM)}`;
  const box = el('camInfo');
  if(!box) return;
  const same = Math.abs(cam.az-VIEW_CAM.az) < 1e-6 && Math.abs(cam.el-VIEW_CAM.el) < 1e-6;
  box.innerHTML = `相机 ${camText(cam)}`
    + (same
        ? ' · <span style="color:var(--ok)">= 默认视角</span>'
        : ' · <span style="color:var(--warn)">≠ 默认视角</span>');
}
function renderScene(){
  updateCamInfo();
  const svg = el('view');
  const W = svg.clientWidth || 700, H = svg.clientHeight || 600;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const pr = projector(cam, W, H);
  const items = [];      /* 可排序的线段 */
  const pieceHits = [];  /* 件级点击区（面），按深度排序后铺在线之上、hit 线之下 */
  let back = '';         /* 背景层 */
  let front = '';        /* 顶层标记（插槽角点） */

  /* 竖轴 */
  const A = pr([0,0,-1.25]), B = pr([0,0,1.25]);
  back += `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="rgba(255,255,255,.10)" stroke-width="1" stroke-dasharray="2 5"/>`;

  ['upper','lower'].forEach(key=>{
    const V = frameData(key);
    const P = V.map(v=>pr(v));

    /* 面（淡填充）：上冷下暖，便于区分两组 */
    FACES.forEach(f=>{
      const pts=[P[f[0]],P[f[1]],P[f[2]]];
      const fill = key==='upper' ? 'rgba(120,165,255,0.055)' : 'rgba(255,155,90,0.045)';
      const st   = key==='upper' ? 'rgba(150,185,255,.12)'  : 'rgba(255,180,120,.10)';
      back += `<polygon points="${pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')}"
        fill="${fill}" stroke="${st}" stroke-width="1"/>`;
    });

    /* 大边中段（两端由小四面体的尖边构成） */
    BIG_EDGES.forEach(([a,b])=>{
      const st = bigEdgeStatus(key,a,b);
      const A0=V[a], B0=V[b];
      const m1=[A0[0]+(B0[0]-A0[0])*K, A0[1]+(B0[1]-A0[1])*K, A0[2]+(B0[2]-A0[2])*K];
      const m2=[A0[0]+(B0[0]-A0[0])*(1-K), A0[1]+(B0[1]-A0[1])*(1-K), A0[2]+(B0[2]-A0[2])*(1-K)];
      const p1=pr(m1), p2=pr(m2);
      const col = st.conflict ? '#ff5f5f' : (st.color ? srtColor(st.color) : 'rgba(255,255,255,.22)');
      items.push({d:(p1.d+p2.d)/2, svg:
        `<line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}"
           stroke="${col}" stroke-width="${st.conflict?2.2:1.6}" ${st.conflict?'stroke-dasharray="3 3"':''}
           opacity="${st.color||st.conflict?0.95:0.5}"/>`});
    });

    /* 小四面体 6 边 */
    for(let i=0;i<4;i++){
      const slot = state.slots[key][i];
      const piece = pieceById(slot.piece);
      if(!piece) continue;
      const pts = piecePoints(key, i, effVariant(key, slot.variant));
      const PP = pts.map(pr);
      /* 选中态：件被选中，或它所在的槽位被选中 */
      const isSelSlotHere = ui.sel && ui.sel.kind==='slot' && ui.sel.frame===key && ui.sel.slot===i;
      const isSelP = isSelSlotHere || (ui.sel && ui.sel.kind==='piece' && ui.sel.piece===piece.id);
      const faceSvg = FACES.map(f=>{
        const t=[PP[f[0]],PP[f[1]],PP[f[2]]];
        return `<polygon data-kind="piece" data-piece="${piece.id}" data-frame="${key}" data-slot="${i}"
          points="${t.map(q=>`${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' ')}"
          fill="${isSelP?'rgba(138,180,248,.14)':'rgba(0,0,0,0)'}"
          style="pointer-events:fill;cursor:pointer"/>`;
      }).join('');
      pieceHits.push({d:(PP[0].d+PP[1].d+PP[2].d+PP[3].d)/4, svg:faceSvg});
      for(let e=0;e<6;e++){
        const a=EDGE_DEFS[e][0], b=EDGE_DEFS[e][1];
        const p1=PP[a], p2=PP[b];
        const st = piece.edges[e];
        const isSelEdge = ui.sel && ui.sel.kind==='edge' && ui.sel.piece===piece.id && ui.sel.edge===e;
        const isSelPiece = isSelP;
        const color = srtColor(st.srt);
        const dash = st.style==='dashed' ? 'stroke-dasharray="7 5"' : '';
        const w = isSelEdge?3.4:(isSelPiece?2.6:2.0);
        let svgLine = '';
        if(isSelEdge) svgLine += `<line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}" stroke="#ffffff" stroke-width="8" opacity=".35" stroke-linecap="round"/>`;
        svgLine += `<line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}"
           stroke="${color}" stroke-width="${w}" ${dash} stroke-linecap="round" opacity="${isSelEdge?1:0.95}"/>`;
        items.push({d:(p1.d+p2.d)/2, svg:svgLine,
          hit:`<line data-kind="edge" data-piece="${piece.id}" data-edge="${e}" data-frame="${key}" data-slot="${i}"
             x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}"
             stroke="transparent" stroke-width="10" style="pointer-events:stroke;cursor:pointer"/>`});
      }
    }

    /* 插槽角点标记（顶层，避免被边遮住点击） */
    for(let i=0;i<4;i++){
      const p = P[i];
      const slot = state.slots[key][i];
      const piece = pieceById(slot.piece);
      const isSel = ui.sel && ui.sel.kind==='slot' && ui.sel.frame===key && ui.sel.slot===i;
      front += `<g>
        <circle data-kind="slot" data-frame="${key}" data-slot="${i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9"
          fill="transparent" stroke="${isSel?'#8ab4f8':'rgba(138,180,248,.45)'}" stroke-width="${isSel?2:1}"
          style="pointer-events:all;cursor:pointer"/>
        <title>${key==='upper'?'上':'下'}${SLOT_SUB[key][i]}${piece?' · '+pieceName(piece.id):' · 空'}</title>
        ${piece?`<text x="${(p.x+12).toFixed(1)}" y="${(p.y+4).toFixed(1)}" font-size="10.5"
          fill="rgba(226,232,248,.78)" style="pointer-events:none">${pieceName(piece.id)}</text>`:''}
      </g>`;
    }

    /* 大四面体名称（贴在各自顶点附近） */
    const ap = P[0];
    front += `<text x="${ap.x.toFixed(1)}" y="${(ap.y + (key==='upper'?-22:24)).toFixed(1)}" font-size="11"
      fill="${key==='upper'?'rgba(180,210,255,.6)':'rgba(255,200,150,.55)'}" text-anchor="middle"
      style="pointer-events:none">${key==='upper'?'上四面体':'下四面体'}</text>`;
  });

  items.sort((p,q)=>q.d-p.d);   /* 远 -> 近 */
  pieceHits.sort((p,q)=>q.d-p.d);
  const hitLayer = items.map(i=>i.hit||'').join('');
  svg.innerHTML = back + items.map(i=>i.svg).join('') + pieceHits.map(i=>i.svg).join('') + hitLayer + front;
}

/* ============================================================
   5. 小四面体调色板（两组独立摆放）
   ============================================================ */
const PAL_CAM = {az:-0.7, el:0.45, zoom:1, panX:0, panY:0};   /* 图例视角：az -40.1° / el 25.8° */
function renderPalette(){
  const W=46, H=42;
  const PP = fitProjector(PAL_CAM, W, H, CANON);
  ['upper','lower'].forEach(key=>{
    const host = el(key==='upper'?'grpUpper':'grpLower');
    let html='';
    state.pieces.filter(p=>p.group===key).forEach(p=>{
      /* 每件一行：横排 6 种摆法，拖哪个用哪个（件+摆法一起放） */
      let cells='';
      VARIANTS.forEach((v,vi)=>{
        const pm = [0, v.perm[0]+1, v.perm[1]+1, v.perm[2]+1];   /* 底顶点 p 画在 perm 指定位 */
        let body='';
        for(let e=0;e<6;e++){
          const a=EDGE_DEFS[e][0], b=EDGE_DEFS[e][1];
          const p1=PP[pm[a]], p2=PP[pm[b]];
          const st=p.edges[e];
          const dash=st.style==='dashed'?'stroke-dasharray="4 3"':'';
          body+=`<line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}"
            stroke="${srtColor(st.srt)}" stroke-width="1.7" ${dash} stroke-linecap="round"/>`;
        }
        cells += `<div class="vcell" data-piece="${p.id}" data-var="${vi}"
          title="${v.id} ${v.desc} · 拖到槽位">${`<svg viewBox="0 0 ${W} ${H}">${body}</svg>`}</div>`;
      });
      const bad = faceViolations(p).length;
      html += `<div class="piece ${ui.sel&&ui.sel.piece===p.id?'sel':''}" data-piece="${p.id}">
        <div class="cap"><b>${pieceName(p.id)}</b>
          ${bad?`<span class="tag bad">SRT△${bad}</span>`:''}
        </div>
        <div class="vgrid6">${cells}</div>
      </div>`;
    });
    if(host) host.innerHTML=html;   /* 左栏已移除：仅更新顶栏组按钮 */
    const fb = el(key==='upper' ? 'flipUpper' : 'flipLower');
    if(fb){
      const m = groupMode(key);
      fb.textContent = VARIANTS[m].id;
      fb.classList.toggle('on', m!==0);
      fb.title = `组模式 shift ${m}（${VARIANTS[m].desc}）· 点击切换`;
    }
    const sb = el(key==='upper' ? 'seqUpper' : 'seqLower');
    if(sb){
      const q = groupSeq(key);
      sb.textContent = 'Shift 槽位 '+q;
      sb.classList.toggle('on', q!==0);
      sb.title = `Shift 槽位 ${q} · 点击轮换四个槽位的内容（顶点槽固定）`;
    }
  });
}
function faceViolations(p){
  const bad=[];
  FACES.forEach((f,fi)=>{
    const [x,y,z]=f;
    const c=[p.edges[edgeIdxOf(x,y)].srt, p.edges[edgeIdxOf(x,z)].srt, p.edges[edgeIdxOf(y,z)].srt];
    const ok = new Set(c).size===3 && SRT_ORDER.every(s=>c.includes(s));
    if(!ok) bad.push({face:f, colors:c});
  });
  return bad;
}

   6. 属性 Grid（四个槽位）

function renderGrid(){
  const key = ui.tab;
  const grp = key==='upper'?[1,2,3,4]:[5,6,7,8];
  const hiAt = selSlotOf();
  let html = `<table class="grid"><tbody>`;
  for(let i=0;i<4;i++){
    const slot = state.slots[key][i];
    const piece = pieceById(slot.piece);
    const vc = VARIANTS[slot.variant];
    const isHi = !!(hiAt && hiAt.frame===key && hiAt.slot===i);   /* 只点亮所选槽位 */
    html += `<tr data-row="${i}" class="${isHi?'hi':''}">
      <td class="c-slot">
        <span class="slotname">${SLOT_SUB[key][i]}</span>
      </td>
      <td class="c-piece">
        <select class="psel" data-slot="${i}" data-frame="${key}">
          ${grp.map(g=>`<option value="${g}" ${g===slot.piece?'selected':''}>${pieceName(g)}</option>`).join('')}
        </select>
        <span class="puse">${vc.id} · ${vc.desc}</span>
        <button class="mini" data-act="align" data-frame="${key}" data-slot="${i}">对齐</button>
      </td>
      <td class="c-var"><div class="vgrid" id="vg-${key}-${i}"></div></td>
      <td class="c-state" id="st-${key}-${i}"></td>
    </tr>`;

  html += `</tbody></table>`;
  el('gridBox').innerHTML = html;

}
function updatePreviews(){
  const key = ui.tab;
  for(let i=0;i<4;i++){
    const host = el(`vg-${key}-${i}`);
    if(!host) continue;
    const slot = state.slots[key][i];
    const piece = pieceById(slot.piece);
    let html='';
    VARIANTS.forEach((v,vi)=>{
      const cf = variantConflicts(key,i,vi);
      const bad = cf.color>0;
      const W=46,H=42;
      let g='';
      if(piece){
        const sock = socketPoints(key,i);
        const pts3 = [sock.apex, ...sock.basePts];
        const vEff = effVariant(key, vi);
        const perm = VARIANTS[vEff].perm;
        const pp = [sock.apex, null, null, null];
        for(let p=1;p<=3;p++) pp[p] = sock.basePts[perm[p-1]];
        /* 统一投影：以插槽外框为基准做等比缩放，插槽与积木同一坐标系 */
        const prc = projector(cam,1,1);
        const raw = pts3.map(p=>prc(p));
        let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
        raw.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);});
        const bw=Math.max(x1-x0,1e-6), bh=Math.max(y1-y0,1e-6);
        const k=Math.min((W-8)/bw,(H-8)/bh);
        const cx=(x0+x1)/2, cy=(y0+y1)/2;
        const M = p=>{ const q=prc(p); return {x:W/2+(q.x-cx)*k, y:H/2+(q.y-cy)*k}; };
        /* 插槽淡框 */
        for(let t=0;t<3;t++){
          const p1=M(sock.apex), p2=M(sock.basePts[t]);
          g += `<line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}" stroke="rgba(255,255,255,.14)" stroke-width="1"/>`;
        }
        /* 小四面体 6 边 */
        const Q = pp.map(M);
        for(let e=0;e<6;e++){
          const a=EDGE_DEFS[e][0], b=EDGE_DEFS[e][1];
          const p1=Q[a], p2=Q[b];
          const st=piece.edges[e];
          g += `<line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}"
            stroke="${srtColor(st.srt)}" stroke-width="1.8" ${st.style==='dashed'?'stroke-dasharray="4 3"':''} stroke-linecap="round"/>`;
        }
      }
      const dotCol = bad? '#ff6b6b' : '#5fd38a';
      html += `<div class="var ${vi===slot.variant?'on':''} ${bad?'bad':''}" data-slot="${i}" data-var="${vi}"
        title="${v.id} ${v.desc}${bad?' · 与邻槽同边颜色冲突':' · 有效'}">
        <em>${v.id}</em><span class="dot" style="background:${dotCol}"></span>
        <svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
    });
    host.innerHTML = html;
  }
  /* 状态列 */
  for(let i=0;i<4;i++){
    const cell = el(`st-${ui.tab}-${i}`);
    if(!cell) continue;
    const cf = variantConflicts(ui.tab,i,state.slots[ui.tab][i].variant);
    const piece = pieceById(state.slots[ui.tab][i].piece);
    const fv = piece?faceViolations(piece).length:0;
    cell.innerHTML =
      (cf.color? `<span class="badge bad">色冲突${cf.color}</span>` : `<span class="badge ok">色一致</span>`) +
      (fv? `<br><span class="badge warn">SRT△${fv}</span>`:'');
  }
}

   7. 选中对象 / 边编辑
   ============================================================ */
/* 统一的选择处理：SVG 内的边 / 角点 / 件。
   注：#view 上用了 setPointerCapture，click 的 target 会变成 <svg>，
   所以真实点击走 pointerup 里记录的 pointerdown 目标，这里只做落地。 */
let lastPickAt = 0;
function pickElement(node){
  if(!node || !node.dataset) return false;
  const kind = node.dataset.kind;
  if(kind==='edge' || kind==='piece'){
    /* 主画面点击一律落到槽位（不选边、不选件） */
    const frame = node.dataset.frame, slot = node.dataset.slot;
    if(frame && slot!==undefined && slot!==''){
      ui.sel = {kind:'slot', frame, slot:Number(slot)};
      if(ui.tab!==frame){
        ui.tab = frame;
        document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===ui.tab));
      }
    }else{
      const pid = Number(node.dataset.piece);
      ui.sel = {kind:'piece', piece:pid};
      const pc = pieceById(pid);
      if(pc && ui.tab!==pc.group){
        ui.tab = pc.group;
        document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===ui.tab));
      }
    }
  }else if(kind==='slot'){
    ui.sel = {kind:'slot', frame:node.dataset.frame, slot:Number(node.dataset.slot)};
    ui.tab = node.dataset.frame;
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===ui.tab));
  }else{
    return false;
  }
  lastPickAt = Date.now();
  renderScene(); renderPalette(); renderGrid(); renderSel();
  return true;
}

    <div class="row"><span class="lb">小四面体</span><b>${pieceName(p.id)}</b>
      <span class="badge">${p.group==='upper'?'上组':'下组'}</span>
      <span class="badge ${faceViolations(p).length?'bad':'ok'}">${faceViolations(p).length? 'SRT△×'+faceViolations(p).length : 'SRT△ 合规'}</span></div>
    ${cur?`<div class="row"><span class="lb">边</span><b>${EDGE_LABEL[s.edge]}</b>
      <div class="seg">
        ${SRT_ORDER.map(k=>`<button class="srt-${k} ${cur.srt===k?'on':''}" data-act="srt" data-piece="${p.id}" data-edge="${s.edge}" data-srt="${k}">${k}</button>`).join('')}
      </div></div>`:''}
    <div class="row"><span class="lb">线型</span>${linesOf(p)}</div>
    <div class="kv" style="margin-top:4px">线型由卦象三爻决定（三爻=S 二爻=R 初爻=T，阳实阴虚），换色后自动跟随。</div>
    <div class="edgegrid">${rows}</div>
    <div class="row"><button data-act="std" data-piece="${p.id}">标准三色（SRT△）</button></div>`;
}
function slotStatusHTML(key,i){
  const cf = variantConflicts(key,i,state.slots[key][i].variant);
  return (cf.color? `<span class="badge bad">色冲突 ${cf.color}</span>`:`<span class="badge ok">色一致</span>`);
}

/* ============================================================
   8. 校验
   ============================================================ */
function validate(){
  const rep = {items:[], nBad:0, nWarn:0};
  /* ① 面三色 */
  state.pieces.forEach(p=>{
    faceViolations(p).forEach(v=>{
      rep.items.push({sev:'bad', text:`小四面体 ${pieceName(p.id)} 面(${v.face.join('')}) 三边为 ${v.colors.join('/')}，应 S·R·T 各一次`,
        piece:p.id, edge:v.face});
      rep.nBad++;
    });
  });
  /* ② 大边两端一致 */
  ['upper','lower'].forEach(key=>{
    BIG_EDGES.forEach(([a,b])=>{
      const st = bigEdgeStatus(key,a,b);
      if(st.missing){
        rep.items.push({sev:'warn', text:`${key==='upper'?'上':'下'}四面体 边 ${SLOT_SUB[key][a]}—${SLOT_SUB[key][b]}：有槽位未放置小四面体`});
        rep.nWarn++;
      }else if(st.conflict){
        rep.items.push({sev:'bad', text:`${key==='upper'?'上':'下'}四面体 边 ${SLOT_SUB[key][a]}—${SLOT_SUB[key][b]}：两端颜色冲突 ${st.a.srt} ≠ ${st.b.srt}`,
          frame:key, slot:a});
        rep.nBad++;
      }
    });
  });
  lastReport = rep;
  renderReport();
  return rep;
}
function renderReport(){
  const box = el('repBox'), sum = el('repSum');
  if(!lastReport){
    box.innerHTML = `<div class="kv">点顶部「校验」检查 SRT△ 规则与大边一致性。</div>`;
    sum.textContent = '未校验';
    return;
  }
  const r = lastReport;
  sum.textContent = `异常 ${r.nBad} · 提示 ${r.nWarn}`;
  if(!r.items.length){
    box.innerHTML = `<div class="ritem ok">全部通过：8 个小四面体均满足 SRT△ 规则，大边两端同色（线型不校验，允许交错）。</div>`;
    return;
  }
  box.innerHTML = r.items.map((it,i)=>`<div class="ritem ${it.sev}" data-ri="${i}">${it.text}</div>`).join('');
}

/* ============================================================
   9. 交互
   ============================================================ */
function el(id){ return document.getElementById(id); }

/* ---------- 拖动放置：左栏元件 / 主图件 → 槽位（同组内交换） ---------- */
const dnd = {active:false, piece:null, variant:null, ghost:null, hover:null, prevAttr:null};
function slotLabel(frame, slot){
  return (frame==='upper'?'上':'下') + SLOT_SUB[frame][slot];
}
function nearestSlotAt(x,y){
  let best=null, bd=48;
  document.querySelectorAll('#view circle[data-kind=slot]').forEach(c=>{
    const r=c.getBoundingClientRect();
    const d=Math.hypot(x-(r.left+r.width/2), y-(r.top+r.height/2));
    if(d<bd){ bd=d; best=c; }
  });
  return best;
}
function slotAtPoint(x,y){
  const e = document.elementFromPoint(x,y);
  if(e && e.closest){
    const cir = e.closest('circle[data-kind=slot]');
    if(cir) return {frame:cir.dataset.frame, slot:Number(cir.dataset.slot), el:cir};
    const tr = e.closest('#gridBox tr[data-row]');
    if(tr) return {frame:ui.tab, slot:Number(tr.dataset.row), el:tr};
  }
  const near = nearestSlotAt(x,y);
  return near ? {frame:near.dataset.frame, slot:Number(near.dataset.slot), el:near} : null;
}
function restoreHover(){
  const e = dnd.hover;
  if(e){
    if(e.tagName==='circle' && dnd.prevAttr){
      e.setAttribute('stroke', dnd.prevAttr.stroke);
      e.setAttribute('stroke-width', dnd.prevAttr.sw);
    }else{
      e.classList.remove('drop-hover');
    }
  }
  dnd.hover = null; dnd.prevAttr = null;
}
function hoverTarget(t){
  const e = t ? t.el : null;
  if(dnd.hover === e) return;
  restoreHover();
  if(!e) return;
  dnd.hover = e;
  if(e.tagName==='circle'){
    dnd.prevAttr = {stroke:e.getAttribute('stroke'), sw:e.getAttribute('stroke-width')};
    e.setAttribute('stroke', '#5fd38a');
    e.setAttribute('stroke-width', '3');
  }else{
    e.classList.add('drop-hover');
  }
}
function dndStart(pieceId, variant, x, y){
  const pc = pieceById(pieceId);
  if(!pc || dnd.active) return;
  dnd.active = true; dnd.piece = pc.id;
  dnd.variant = (variant===undefined || variant===null) ? null : Number(variant);
  document.body.classList.add('dnd');
  const g = document.createElement('div');
  g.id = 'dndGhost';
  document.body.appendChild(g);
  dnd.ghost = g;
  dndMove(x, y);
}
function dndMove(x,y){
  if(!dnd.active) return;
  const pc = pieceById(dnd.piece);
  const t = slotAtPoint(x,y);
  const ok = !!(t && pc && pc.group===t.frame);
  hoverTarget(ok ? t : null);
  if(dnd.ghost){
    dnd.ghost.style.left = (x+14)+'px';
    dnd.ghost.style.top  = (y+12)+'px';
    const vTxt = (dnd.variant!==null) ? ' · '+VARIANTS[dnd.variant].id : '';
    dnd.ghost.textContent = pc ? `${pieceName(pc.id)}${vTxt} → ${ok ? slotLabel(t.frame,t.slot) : '同组槽位'}` : '';
    dnd.ghost.classList.toggle('bad', !ok);
  }
}
function dndEnd(x,y,drop){
  if(!dnd.active) return;
  const pc = pieceById(dnd.piece);
  const vi = dnd.variant;
  const t = drop ? slotAtPoint(x,y) : null;
  restoreHover();
  if(dnd.ghost){ dnd.ghost.remove(); dnd.ghost = null; }
  document.body.classList.remove('dnd');
  dnd.active = false; dnd.piece = null; dnd.variant = null;
  if(t && pc && pc.group===t.frame){
    setSlotPieceVar(t.frame, t.slot, pc.id, vi);   /* 带摆法则指定，否则保留槽位摆法；已占用自动对调 */
  }
}
/* 左栏摆法缩略图：按住拖动 = 放置该件+该摆法；不移动 = 点击选件（沿用原 click） */
document.addEventListener('pointerdown', e=>{
  const cell = (e.button===0 && e.target.closest) ? e.target.closest('#left .vcell') : null;
  if(!cell) return;
  const pid = Number(cell.dataset.piece), vi = Number(cell.dataset.var);
  const sx = e.clientX, sy = e.clientY;
  let started = false;
  const mv = ev=>{
    if(!started && Math.hypot(ev.clientX-sx, ev.clientY-sy) > 5){
      started = true;
      cell.classList.add('dragging');
      dndStart(pid, vi, ev.clientX, ev.clientY);
    }
    if(started){ dndMove(ev.clientX, ev.clientY); if(ev.cancelable) ev.preventDefault(); }
  };
  const up = ev=>{
    document.removeEventListener('pointermove', mv);
    document.removeEventListener('pointerup', up);
    cell.classList.remove('dragging');
    if(started) dndEnd(ev.clientX, ev.clientY, true);
  };
  document.addEventListener('pointermove', mv, {passive:false});
  document.addEventListener('pointerup', up);
});
function commit(reason){
  applyGuaStyles(state.pieces);   /* 线型由卦象三爻决定（换色后自动跟随） */
  saveState();
  renderScene(); renderPalette(); renderGrid(); renderSel();
  if(reason==='validate') renderReport();
}

document.addEventListener('click', ev=>{
  const t = ev.target;
  /* 分组模式切换（shift 0-5 循环） */
  const fb = t.closest ? t.closest('[data-mode]') : null;
  if(fb){
    const key = fb.dataset.mode;
    if(!state.groups) state.groups = {upper:{mode:0}, lower:{mode:0}};
    if(!state.groups[key]) state.groups[key] = {mode:0};
    state.groups[key].mode = (groupMode(key) + 1) % 6;
    commit();
    return;
  }
  /* 槽位序列 shift（S0-S5）：重排该组四个槽位的内容 */
  const sq = t.closest ? t.closest('[data-seq]') : null;
  if(sq){
    const key = sq.dataset.seq;
    if(!state.groups) state.groups = {upper:{mode:0}, lower:{mode:0}};
    if(!state.groups[key]) state.groups[key] = {mode:0};
    stepSlotShift(key);
    commit();
    return;
  }
  /* 边属性按钮（须先于 [data-kind]，行内按钮才不会被行的选中逻辑吞掉） */
  const act = t.closest ? t.closest('[data-act]') : null;
  if(act){
    const a = act.dataset.act;
    const p = pieceById(act.dataset.piece);
    if(a==='srt' && p){
      const e = p.edges[Number(act.dataset.edge)];
      const code = act.dataset.srt;
      if(e && SRT[code]){
        e.srt = code;
        const twin = p.edges.find(x=>x!==e && x.srt===code);
        if(twin) e.style = twin.style;   /* 跟随同色边虚实，保持件内一致 */
        commit();
      }
    }

    else if(a==='std' && p){ STD_EDGES.forEach((e,i)=>{ p.edges[i].srt=e.srt; }); commit(); }
    else if(a==='flip' && p){ p.edges.forEach(e=>{ e.style = e.style==='dashed'?'solid':'dashed'; }); commit(); }
    else if(a==='align'){
      const key = act.dataset.frame || ui.tab;
      const i = Number(act.dataset.slot);
      state.slots[key][i].variant = bestVariant(key,i).variant;
      commit();
    }
    return;
  }
  /* 边 / 槽位 / 件 选择（SVG 内） */
  const pick = t.closest ? t.closest('[data-kind]') : null;
  if(pick){
    if(Date.now() - lastPickAt > 300) pickElement(pick);   /* 与 pointerup 路径去重 */
    return;
  }
  /* 摆法切换 */
  const varEl = t.closest ? t.closest('.var') : null;
  if(varEl){
    const slotIdx = Number(varEl.dataset.slot), vi = Number(varEl.dataset.var);
    state.slots[ui.tab][slotIdx].variant = vi;
    ui.sel = {kind:'slot', frame:ui.tab, slot:slotIdx};
    commit();
    return;
  }
  /* 属性 Grid 任意行点击 → 选中该槽位 */
  const grow = (t.closest && t.tagName!=='SELECT') ? t.closest('#gridBox tr[data-row]') : null;
  if(grow){
    ui.sel = {kind:'slot', frame:ui.tab, slot:Number(grow.dataset.row)};
    renderScene(); renderGrid(); renderSel();
    return;
  }

  /* 侧栏页签 */
  const tab = t.closest ? t.closest('[data-tab]') : null;
  if(tab){
    ui.tab = tab.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===ui.tab));
    renderGrid(); renderSel();
    return;
  }
  /* 视角预设 */
  const vw = t.closest ? t.closest('[data-view]') : null;
  if(vw){
    const v = vw.dataset.view;
    if(v==='iso'){ cam.az=VIEW_CAM.az; cam.el=VIEW_CAM.el; }
    else if(v==='front'){ cam.az=0; cam.el=0.05; }
    else if(v==='top'){ cam.az=0; cam.el=1.42; }
    else { cam.az=VIEW_CAM.az; cam.el=VIEW_CAM.el; cam.zoom=1; cam.panX=0; cam.panY=0; }
    scheduleRender();
    return;
  }
  /* 校验报告条目 */
  const ri = t.closest ? t.closest('[data-ri]') : null;
  if(ri && lastReport){
    const it = lastReport.items[Number(ri.dataset.ri)];
    if(it){
      if(it.piece!==undefined){ ui.sel={kind:'piece', piece:it.piece}; }
      else if(it.frame){ ui.sel={kind:'slot', frame:it.frame, slot:it.slot}; ui.tab=it.frame;
        document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===ui.tab)); }
      renderScene(); renderPalette(); renderGrid(); renderSel();
    }
    return;
  }
  /* 左栏元件点击：落到它所在的槽位 */
  const pc = t.closest ? t.closest('.piece') : null;
  if(pc){
    const pid = Number(pc.dataset.piece);
    const at = slotOfPiece(pid);
    if(at){
      ui.sel = {kind:'slot', frame:at.frame, slot:at.slot};
      if(ui.tab!==at.frame){
        ui.tab = at.frame;
        document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===ui.tab));
      }
    }else{
      ui.sel = {kind:'piece', piece:pid};
    }
    renderScene(); renderPalette(); renderGrid(); renderSel();
  }
});

/* 槽位下拉（属性 Grid / 选中面板）：换件时同组内自动对调，避免重复占位 */
document.addEventListener('change', e=>{
  const t = e.target;
  if(!(t.matches && t.matches('select.psel'))) return;
  setSlotPiece(t.dataset.frame || ui.tab, Number(t.dataset.slot), Number(t.value));
});

/* 配色组：下拉选择 / 取色 / 新增（顶栏） */
el('palSelect').addEventListener('change', e=>setActivePalette(e.target.value));
SRT_ORDER.forEach(k=>{
  const inp = el('palColor'+k);
  if(!inp) return;
  inp.addEventListener('input', ()=>{
    const p = activePalette();
    if(!p) return;
    p.colors[k] = inp.value;
    state.paletteId = p.id;
    const sel = el('palSelect'); if(sel) sel.value = p.id;
    applyPaletteVars();
    renderScene(); renderPalette(); renderGrid(); renderSel();
    saveState();
  });
});
el('btnAddPal').addEventListener('click', ()=>{
  const base = activePalette();
  const id = 'p'+Date.now().toString(36);
  state.palettes.push({id, name:'配色组 '+(state.palettes.length+1), colors:{S:base.colors.S,R:base.colors.R,T:base.colors.T}});
  state.paletteId = id;
  applyPaletteVars();
  renderPalettes(); renderScene(); renderPalette(); renderGrid(); renderSel();
  saveState();
});

/* 滑块 */
function bindSlider(id, key, field, fmt){
  const s = el(id);
  const out = el(id+'v');
  let saveT = null;
  const upd = ()=>{
    state.frames[key][field] = Number(s.value);
    out.textContent = fmt(s.value);
    scheduleRender();
    /* 拖动停顿 300ms 后落盘，避免高频写 localStorage */
    clearTimeout(saveT);
    saveT = setTimeout(saveState, 300);
  };
  s.addEventListener('input', upd);
  s.addEventListener('change', saveState);   /* 松手立即保存 */
}
bindSlider('rotU','upper','rotationDeg', v=>v+'°');
bindSlider('offU','upper','axisOffset', v=>Number(v).toFixed(2));
bindSlider('rotD','lower','rotationDeg', v=>v+'°');
bindSlider('offD','lower','axisOffset', v=>Number(v).toFixed(2));

/* 按钮 */
el('btnAlign').addEventListener('click', ()=>{
  mirrorGroup('upper'); mirrorGroup('lower');
  validate(); commit('validate');
});
el('btnValidate').addEventListener('click', ()=>{ validate(); commit('validate'); });
el('btnExport').addEventListener('click', ()=>{
  applyGuaMeta(state);      /* 卦象（卦名 + 三爻）一并导出 */
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '星四面体配置.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
});
el('btnImport').addEventListener('click', ()=> el('fileImport').click());
el('fileImport').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const s = JSON.parse(rd.result);
      state = normalize(s);
      syncSliders();
      commit();
      el('saveState').textContent = '已导入';
    }catch(err){
      el('saveState').textContent = '导入失败';
      alert('JSON 解析失败：'+err.message);
    }
  };
  rd.readAsText(f);
  e.target.value='';
});
el('btnReset').addEventListener('click', ()=>{
  const b = el('btnReset');
  if(b.dataset.arm !== '1'){
    b.dataset.arm='1'; b.textContent='确认重置？'; b.classList.add('on');
    setTimeout(()=>{ if(b.dataset.arm==='1'){ b.dataset.arm='0'; b.textContent='重置'; b.classList.remove('on'); } }, 4000);
    return;
  }
  b.dataset.arm='0'; b.textContent='重置'; b.classList.remove('on');
  state = defaultState();
  syncSliders();
  lastReport=null; renderReport();
  commit();
});

function syncSliders(){
  el('rotU').value = state.frames.upper.rotationDeg; el('rotUv').textContent = state.frames.upper.rotationDeg+'°';
  el('offU').value = state.frames.upper.axisOffset; el('offUv').textContent = state.frames.upper.axisOffset.toFixed(2);
  el('rotD').value = state.frames.lower.rotationDeg; el('rotDv').textContent = state.frames.lower.rotationDeg+'°';
  el('offD').value = state.frames.lower.axisOffset; el('offDv').textContent = state.frames.lower.axisOffset.toFixed(2);
}

/* 视图拖拽：左键按住 = 旋转视角，右键按住 = 平移画面 */
(function(){
  const svg = el('view');
  let drag=null, suppressClick=false, downTarget=null;
  svg.addEventListener('pointerdown', e=>{
    if(drag) return;                       /* 拖动中不切换键的作用，避免跳变 */
    if(e.button!==0 && e.button!==2) return;
    downTarget = e.target;                 /* 记录真实命中元素（capture 会改掉 click 的 target） */
    /* 起点决定语义：按在件面或该件的边上 = 拖件；按在空白 = 旋转视角；右键 = 平移 */
    const pieceEl = (e.button===0 && e.target.closest)
      ? (e.target.closest('polygon[data-kind=piece]') || e.target.closest('#view line[data-kind=edge]'))
      : null;
    const mode = e.button===2 ? 'pan' : (pieceEl ? 'piece' : 'rotate');
    drag = {x:e.clientX, y:e.clientY, az:cam.az, el:cam.el,
            panX:cam.panX, panY:cam.panY, moved:0, mode,
            piece: pieceEl ? Number(pieceEl.dataset.piece) : null};
    svg.classList.add('drag');
    svg.classList.toggle('pan', mode==='pan');
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', e=>{
    if(!drag) return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    drag.moved = Math.max(drag.moved, Math.hypot(dx,dy));
    if(drag.mode==='piece'){
      if(!dnd.active && drag.moved > 5) dndStart(drag.piece, null, e.clientX, e.clientY);
      else if(dnd.active) dndMove(e.clientX, e.clientY);
      return;
    }
    if(drag.mode==='pan'){
      cam.panX = drag.panX + dx;
      cam.panY = drag.panY + dy;
    }else{
      cam.az = drag.az + dx*0.008;
      cam.el = Math.max(-1.45, Math.min(1.45, drag.el + dy*0.008));
    }
    scheduleRender();
  });
  const end = (e, drop)=>{
    if(drag){
      svg.classList.remove('drag');
      svg.classList.remove('pan');
      if(drag.mode==='piece'){
        if(dnd.active) dndEnd(e.clientX, e.clientY, drop);
        else pickElement(downTarget);      /* 没拖动 = 点击选中该件 */
      }else if(drag.mode==='rotate'){
        if(drag.moved > 5) suppressClick = true;
        else pickElement(downTarget);      /* 未拖动 = 点击：用手上记录的目标选中 */
      }
    }
    drag=null; downTarget=null;
  };
  svg.addEventListener('pointerup', e=>end(e, true));
  svg.addEventListener('pointercancel', e=>end(e, false));
  svg.addEventListener('contextmenu', e=>e.preventDefault());   /* 右键留给平移 */
  svg.addEventListener('click', e=>{
    if(suppressClick){ suppressClick=false; e.stopPropagation(); e.preventDefault(); }
  }, true);
  svg.addEventListener('wheel', e=>{
    e.preventDefault();
    cam.zoom = Math.max(0.35, Math.min(3, cam.zoom * (1 - e.deltaY*0.0012)));
    scheduleRender();
  }, {passive:false});
})();

/* 渲染调度 */
let rafId=null;
function scheduleRender(){
  if(rafId) return;
  rafId = requestAnimationFrame(()=>{
    rafId=null;
    renderScene();
    updatePreviews();
  });
}
window.addEventListener('resize', ()=>scheduleRender());

/* ============================================================
   10. 启动
   ============================================================ */
(function init(){
  const had = loadState();
  applyGuaStyles(state.pieces);   /* 线型由卦象三爻决定 */
  syncSliders();
  applyPaletteVars();
  renderScene(); renderPalette(); renderPalettes(); renderGrid(); renderSel(); renderReport();
  if(!had) saveState();
})();
</script>
